
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Identify scorecard API settings
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser

          URL = "https://simulatorgolftour.com/scorecard/83765/30222"

          class Inspector(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  classes = a.get("class", "")
                  if (
                      a.get("id") == "scorecard-container"
                      or "scorecard-select-item" in classes
                  ):
                      print("ELEMENT:", tag, a)

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,*/*"
              }
          )

          with urllib.request.urlopen(
              req, timeout=40
          ) as response:
              html = response.read().decode(
                  "utf-8", "replace"
              )

          print("=== SCORECARD SETTINGS ===")
          Inspector().feed(html)

          print("\n=== API BASE REFERENCES ===")
          for match in list(re.finditer(
              r"APIBASE|api-base|sgt-api",
              html, re.I
          ))[:20]:
              start = max(0, match.start() - 250)
              end = min(len(html), match.end() + 350)
              print(html[start:end])
              print("---")

          print("\n=== TEST COMPLETE ===")
          PY
