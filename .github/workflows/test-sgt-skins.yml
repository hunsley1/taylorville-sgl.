
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect SGT scorecard JavaScript
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          url = (
              "https://sgt-static.b-cdn.net"
              "/public/scorecard/page.js?v=2.0.26"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*",
                  "Referer": "https://simulatorgolftour.com/"
              }
          )

          with urllib.request.urlopen(
              request, timeout=40
          ) as response:
              js = response.read().decode(
                  "utf-8", "replace"
              )

          print("=== SCORECARD JAVASCRIPT ===")
          print("JavaScript length:", len(js))

          print("\n=== API AND SCORECARD REFERENCES ===")

          patterns = [
              "sgt-api",
              "fetch(",
              "XMLHttpRequest",
              "gross",
              "holeScores",
              "scorecard"
          ]

          for pattern in patterns:
              print("\nSEARCH:", pattern)

              matches = list(re.finditer(
                  re.escape(pattern),
                  js,
                  re.IGNORECASE
              ))

              print("Matches:", len(matches))

              for match in matches[:8]:
                  start = max(0, match.start() - 180)
                  end = min(len(js), match.end() + 250)

                  print(
                      js[start:end].replace("\n", " ")
                  )
                  print("---")

          print("\n=== TEST COMPLETE ===")
          PY
