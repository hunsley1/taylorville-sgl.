
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Verify all Week 4 gross scorecards
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from bs4 import BeautifulSoup

          BASE = "https://simulatorgolftour.com"
          tournaments = ["83765", "83767"]

          def fetch(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html,*/*",
                      "Referer": BASE + "/"
                  }
              )
              with urllib.request.urlopen(
                  req, timeout=40
              ) as response:
                  return BeautifulSoup(
                      response.read(),
                      "html.parser"
                  )

          total = 0
          failures = []

          for tid in tournaments:
              print(f"\n=== TOURNAMENT {tid} ===")

              leaderboard = fetch(
                  f"/sgt-api/leaderboard/{tid}"
              )

              rows = leaderboard.select(
                  "tr.finished-card"
              )

              for row in rows:
                  name = row.get(
                      "data-player-name", ""
                  )

                  link = row.select_one(
                      f'a[href^="/scorecard/{tid}/"]'
                  )

                  try:
                      if link is None:
                          raise ValueError(
                              "Missing scorecard link"
                          )

                      href = link["href"]
                      match = re.fullmatch(
                          rf"/scorecard/{tid}/(\d+)/?",
                          href
                      )

                      if not match:
                          raise ValueError(
                              f"Unexpected link: {href}"
                          )

                      pid = match.group(1)

                      soup = fetch(
                          f"/sgt-api/scorecard/"
                          f"{tid}/{pid}/indv"
                      )

                      gross_row = None

                      for tr in soup.select("tr"):
                          cells = tr.find_all(
                              ["th", "td"],
                              recursive=False
                          )

                          if cells and (
                              cells[0].get_text(
                                  " ", strip=True
                              ).upper() == "GROSS"
                          ):
                              gross_row = cells
                              break

                      if gross_row is None:
                          raise ValueError(
                              "GROSS row missing"
                          )

                      values = [
                          c.get_text(" ", strip=True)
                          for c in gross_row[1:]
                      ]

                      # Skip OUT, IN and TOT
                      # columns after holes 9 and 18.
                      if len(values) != 21:
                          raise ValueError(
                              f"Expected 21 score "
                              f"columns, got {len(values)}"
                          )

                      indices = (
                          list(range(9))
                          + list(range(10, 19))
                      )

                      scores = [
                          int(values[i])
                          for i in indices
                      ]

                      if len(scores) != 18:
                          raise ValueError(
                              "Not 18 hole scores"
                          )

                      gross_total = int(values[20])

                      if sum(scores) != gross_total:
                          raise ValueError(
                              "Gross total mismatch: "
                              f"{sum(scores)} vs "
                              f"{gross_total}"
                          )

                      total += 1

                      print(
                          f"PASS {name}: "
                          f"{scores} "
                          f"TOTAL={gross_total}",
                          flush=True
                      )

                  except Exception as exc:
                      failures.append(
                          f"{tid} {name}: {exc}"
                      )
                      print(
                          f"FAIL {name}: {exc}",
                          flush=True
                      )

          print("\n=== FINAL RESULT ===")
          print("Verified scorecards:", total)
          print("Failures:", len(failures))

          for failure in failures:
              print("ERROR:", failure)

          if failures:
              raise SystemExit(1)

          print("ALL SCORECARDS VERIFIED")
          PY
