
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Find scorecard API endpoint
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          URL = (
              "https://sgt-static.b-cdn.net"
              "/public/scorecard/page.js?v=2.0.26"
          )

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              req, timeout=40
          ) as response:
              js = response.read().decode(
                  "utf-8", "replace"
              )

          print("=== FIND FETCH_DATA FUNCTION ===")

          patterns = [
              r"function\s+Fetch_Data\s*\(",
              r"Fetch_Data\s*=\s*function",
              r"APIBASE",
              r"apiHandler\.Send_Request",
              r"function\s+Setup_Scorecard"
          ]

          for pattern in patterns:
              matches = list(
                  re.finditer(pattern, js, re.I)
              )

              print(
                  "\nPATTERN:", pattern,
                  "MATCHES:", len(matches)
              )

              for match in matches[:5]:
                  start = max(0, match.start() - 150)
                  end = min(
                      len(js),
                      match.end() + (
                          4500 if "Fetch_Data" in pattern
                          else 650
                      )
                  )

                  print(js[start:end])
                  print("\n--- END MATCH ---")

          print("\n=== TEST COMPLETE ===")
          PY
