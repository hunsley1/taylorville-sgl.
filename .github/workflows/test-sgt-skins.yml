
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Find scorecard API endpoint
        run: |
          python3 - <<'PY'
          import re
          import time
          import urllib.request
          import urllib.error

          urls = [
              "https://sgt-static.b-cdn.net/public/scorecard/page.js?v=2.0.26",
              "https://simulatorgolftour.com/scorecard/83765/30222"
          ]

          patterns = [
              r"function\s+Fetch_Data\s*\(",
              r"Fetch_Data\s*=\s*function",
              r"APIBASE",
              r"apiHandler\.Send_Request",
              r"function\s+Setup_Scorecard"
          ]

          for url in urls:
              print("\nTESTING:", url, flush=True)

              content = None

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "*/*",
                              "Referer": "https://simulatorgolftour.com/"
                          }
                      )

                      with urllib.request.urlopen(
                          req, timeout=40
                      ) as response:
                          content = response.read().decode(
                              "utf-8", "replace"
                          )

                      print(
                          "Downloaded:",
                          len(content),
                          "characters",
                          flush=True
                      )
                      break

                  except Exception as exc:
                      print(
                          f"Attempt {attempt} failed: {exc}",
                          flush=True
                      )
                      if attempt < 3:
                          time.sleep(5)

              if content is None:
                  continue

              print("\n=== MATCHES ===")

              for pattern in patterns:
                  matches = list(
                      re.finditer(pattern, content, re.I)
                  )

                  print(
                      "\nPATTERN:", pattern,
                      "MATCHES:", len(matches)
                  )

                  for match in matches[:3]:
                      start = max(0, match.start() - 150)
                      end = min(
                          len(content),
                          match.end() + (
                              4000 if "Fetch_Data" in pattern
                              else 600
                          )
                      )

                      print(content[start:end])
                      print("---")

          print("\n=== TEST COMPLETE ===")
          PY
