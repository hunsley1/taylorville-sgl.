
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Find player scorecard IDs
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from bs4 import BeautifulSoup

          tournaments = ["83765", "83767"]

          for tid in tournaments:
              url = (
                  "https://simulatorgolftour.com"
                  f"/sgt-api/leaderboard/{tid}"
              )

              print(
                  f"\n=== TOURNAMENT {tid} ===",
                  flush=True
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "text/html,*/*",
                          "Referer": "https://simulatorgolftour.com/"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=40
                  ) as response:
                      html = response.read().decode(
                          "utf-8", "replace"
                      )

                  soup = BeautifulSoup(
                      html, "html.parser"
                  )

                  rows = soup.select(
                      "tr.finished-card"
                  )

                  print(
                      "Finished players:",
                      len(rows)
                  )

                  for row in rows:
                      name = row.get(
                          "data-player-name", ""
                      )

                      print("\nPLAYER:", name)

                      print(
                          "ROW ATTRIBUTES:",
                          dict(row.attrs)
                      )

                      links = row.select("a[href]")

                      for link in links[:8]:
                          print(
                              "LINK:",
                              link.get("href"),
                              "TEXT:",
                              link.get_text(
                                  " ", strip=True
                              )[:100]
                          )

                      ids = re.findall(
                          r"(?:scorecard/|data-pid=)"
                          r"[^<\s]{0,100}",
                          str(row),
                          re.I
                      )

                      for value in ids[:5]:
                          print(
                              "SCORECARD REFERENCE:",
                              value[:150]
                          )

                  print(
                      f"\n=== END TOURNAMENT {tid} ==="
                  )

              except Exception as error:
                  print(
                      "ERROR:",
                      type(error).__name__,
                      str(error)
                  )

          print("\n=== TEST COMPLETE ===")
          PY
