
name: Test SGT Skins Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorecard:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Test hole-by-hole scorecard API
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          from bs4 import BeautifulSoup

          urls = [
              "https://simulatorgolftour.com/sgt-api/scorecard/83765/30222/indv",
              "https://simulatorgolftour.com/sgt-api/scorecard/83765/30222/indv/"
          ]

          for url in urls:
              print("\n=== TESTING ===", url, flush=True)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "text/html,*/*",
                          "Referer": "https://simulatorgolftour.com/scorecard/83765/30222"
                      }
                  )

                  with urllib.request.urlopen(
                      req, timeout=40
                  ) as response:
                      html = response.read().decode(
                          "utf-8", "replace"
                      )

                  soup = BeautifulSoup(html, "html.parser")

                  print("SUCCESS")
                  print("HTML length:", len(html))
                  print("Tables:", len(soup.select("table")))

                  for table in soup.select("table")[:5]:
                      print(
                          "TABLE:",
                          table.get_text(" ", strip=True)[:1500]
                      )

                  print("\nGROSS SCORE MATCHES:")

                  for element in soup.find_all(
                      string=lambda s:
                          s and "gross" in s.lower()
                  )[:8]:
                      print(
                          element.parent.parent.get_text(
                              " ", strip=True
                          )[:500]
                      )

                  print("\nHTML PREVIEW:")
                  print(soup.get_text(" ", strip=True)[:2000])

              except urllib.error.HTTPError as exc:
                  print("HTTP ERROR:", exc.code)
              except Exception as exc:
                  print("ERROR:", exc)

          print("\n=== TEST COMPLETE ===")
          PY
