
name: Update TGSL Livestream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Update livestream pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          video_id = "bZStCjbwdXg"

          files = [
              Path("watch-live.html"),
              Path("watch-live.html.")
          ]

          updated = []

          for page in files:
              if not page.is_file():
                  continue

              html = page.read_text(
                  encoding="utf-8"
              )

              # Update the TGSL_LIVE configuration
              pattern = (
                  r'(videoId\s*:\s*["\'])'
                  r'[^"\']*'
                  r'(["\'])'
              )

              html, count = re.subn(
                  pattern,
                  lambda m:
                      m.group(1)
                      + video_id
                      + m.group(2),
                  html,
                  count=1
              )

              if count == 0:
                  print(
                      f"Skipped {page}: "
                      "no videoId configuration found"
                  )
                  continue

              page.write_text(
                  html,
                  encoding="utf-8"
              )

              updated.append(str(page))

          if not updated:
              raise SystemExit(
                  "No livestream files were updated"
              )

          print("Updated livestream files:")
          for name in updated:
              print(name)

          print("YouTube video:", video_id)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already configured."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -u
            git commit -m "Connect YouTube livestream"
            git push
          fi
