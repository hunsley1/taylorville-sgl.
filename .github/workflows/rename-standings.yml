
name: Rename Combined Standings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rename heading
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("index.html")
          html = file.read_text(encoding="utf-8")

          if "Combined standings" not in html:
              raise SystemExit(
                  "Heading not found or already renamed"
              )

          html = html.replace(
              "Combined standings",
              "Standings"
          )

          file.write_text(html, encoding="utf-8")
          print("Heading changed to Standings")
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename combined standings heading"
          git push
