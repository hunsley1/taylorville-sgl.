
name: TGSL YouTube Live Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: tgsl-youtube-live
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check YouTube livestream
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          CHANNEL = "UC-WJOLQudbw8xO7WclLjd2Q"
          KEY = os.environ.get("YOUTUBE_API_KEY", "")
          STATUS = "youtube-live.json"
          KNOWN_VIDEO = "bZStCjbwdXg"

          if not KEY:
              raise RuntimeError(
                  "Missing YOUTUBE_API_KEY secret"
              )

          def youtube(endpoint, params):
              params["key"] = KEY

              url = (
                  "https://www.googleapis.com/youtube/v3/"
                  + endpoint + "?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json"}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return json.load(response)

          def is_live(video_id):
              if not video_id:
                  return False

              data = youtube("videos", {
                  "part": "snippet,liveStreamingDetails",
                  "id": video_id
              })

              for item in data.get("items", []):
                  if item.get("snippet", {}).get(
                      "channelId"
                  ) != CHANNEL:
                      continue

                  details = item.get(
                      "liveStreamingDetails", {}
                  )

                  actual_start = details.get(
                      "actualStartTime"
                  )

                  actual_end = details.get(
                      "actualEndTime"
                  )

                  return bool(
                      actual_start and not actual_end
                  )

              return False

          previous_video = ""

          if os.path.exists(STATUS):
              try:
                  with open(
                      STATUS, encoding="utf-8"
                  ) as f:
                      previous_video = json.load(
                          f
                      ).get("videoId", "")
              except (ValueError, OSError):
                  pass

          video_id = ""

          # Check known broadcasts first.
          candidates = list(dict.fromkeys(
              [previous_video, KNOWN_VIDEO]
          ))

          for candidate in candidates:
              if is_live(candidate):
                  video_id = candidate
                  break

          # Discover new livestreams automatically.
          if not video_id:
              data = youtube("search", {
                  "part": "snippet",
                  "channelId": CHANNEL,
                  "eventType": "live",
                  "type": "video",
                  "maxResults": 10
              })

              for item in data.get("items", []):
                  candidate = item.get(
                      "id", {}
                  ).get("videoId", "")

                  if is_live(candidate):
                      video_id = candidate
                      break

          result = {
              "live": bool(video_id),
              "videoId": video_id,
              "channelId": CHANNEL,
              "checkedAt": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          with open(
              STATUS, "w", encoding="utf-8"
          ) as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

      - name: Commit status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube-live.json

          if ! git diff --cached --quiet; then
            git commit -m "Update TGSL YouTube live status"
            git push
          fi
