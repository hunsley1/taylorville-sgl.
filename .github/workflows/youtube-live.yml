
name: TGSL YouTube Live Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: tgsl-youtube-live
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Check YouTube livestream
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          channel_id = "UC-WJOLQudbw8xO7WclLjd2Q"
          api_key = os.environ["YOUTUBE_API_KEY"]

          params = urllib.parse.urlencode({
              "part": "snippet",
              "channelId": channel_id,
              "eventType": "live",
              "type": "video",
              "maxResults": 1,
              "key": api_key
          })

          url = (
              "https://www.googleapis.com/youtube/v3/search?"
              + params
          )

          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json"}
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              data = json.load(response)

          items = data.get("items", [])
          video_id = (
              items[0].get("id", {}).get("videoId", "")
              if items else ""
          )

          result = {
              "live": bool(video_id),
              "videoId": video_id,
              "channelId": channel_id,
              "checkedAt": datetime.now(
                  timezone.utc
              ).isoformat()
          }

          with open(
              "youtube-live.json", "w",
              encoding="utf-8"
          ) as file:
              json.dump(result, file, indent=2)

          print(
              "Live:", result["live"],
              "Video:", result["videoId"]
          )
          PY

      - name: Commit status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-live.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TGSL YouTube live status"
            git push
          fi
