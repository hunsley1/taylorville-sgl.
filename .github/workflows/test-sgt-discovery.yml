
name: Test SGT Tournament Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect SGT tour JavaScript
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          urls = {
              "TOUR SCRIPT":
                  "https://sgt-static.b-cdn.net/public/tour/page.js?v=2.0.21",
              "COMMON SCRIPT":
                  "https://sgt-static.b-cdn.net/public/assets/pageCommon/common.js?v=2.0.21"
          }

          for name, url in urls.items():
              print("\n" + "=" * 65)
              print(name)

              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "*/*"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      js = response.read().decode(
                          "utf-8", "replace"
                      )

                  print("Downloaded:", len(js), "bytes")

                  lines = js.splitlines()
                  terms = [
                      "APIBASE",
                      "ajax",
                      "fetch(",
                      "events",
                      "tournament",
                      "tour/",
                      "Build_Request_Url"
                  ]

                  matches = set()

                  for i, line in enumerate(lines):
                      if any(
                          term.lower() in line.lower()
                          for term in terms
                      ):
                          matches.add(i)

                  print("\nRELEVANT CODE:")

                  for i in sorted(matches):
                      start = max(0, i - 2)
                      end = min(len(lines), i + 4)

                      print(
                          f"\n--- Lines {start+1}-{end} ---"
                      )

                      for j in range(start, end):
                          print(
                              f"{j+1}: {lines[j][:350]}"
                          )

                  print("\nPOSSIBLE ENDPOINTS:")

                  for item in sorted(set(
                      re.findall(
                          r'["\']([^"\']{1,160})["\']',
                          js
                      )
                  )):
                      if any(
                          word in item.lower()
                          for word in (
                              "tour",
                              "event",
                              "tournament",
                              "leaderboard"
                          )
                      ):
                          print(item)

              except Exception as error:
                  print("ERROR:", error)

          print("\nTEST COMPLETE")
          PY
