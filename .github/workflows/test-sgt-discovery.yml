
name: Test SGT Tournament Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Discover SGT tournament API
        run: |
          python3 - <<'PY'
          import re
          import json
          import urllib.request
          from html import unescape

          SITE = "https://simulatorgolftour.com"
          TOURS = {
              "Hunsley1": 3927,
              "Hunsley2": 3085
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*",
              "Referer": SITE + "/"
          }

          def fetch(url):
              req = urllib.request.Request(
                  url, headers=HEADERS
              )
              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return (
                      response.status,
                      response.headers.get(
                          "Content-Type", ""
                      ),
                      response.read().decode(
                          "utf-8", "replace"
                      )
                  )

          print("=== FIND API BASE ===")

          page_url = SITE + "/tour/3927"
          _, _, html = fetch(page_url)

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)',
              html, re.I
          )

          api_bases = []

          for script in scripts:
              if script.startswith("//"):
                  script = "https:" + script
              elif script.startswith("/"):
                  script = SITE + script

              if not script.startswith("http"):
                  continue

              if not (
                  "common" in script.lower()
                  or "page.js" in script.lower()
              ):
                  continue

              print("Inspecting:", script)

              try:
                  _, _, source = fetch(script)

                  for match in re.finditer(
                      r'.{0,120}APIBASE.{0,180}',
                      source
                  ):
                      print(
                          "API reference:",
                          match.group(0)[:300]
                      )

                  for pattern in (
                      r'APIBASE\s*=\s*["\']([^"\']+)',
                      r'APIBASE\s*:\s*["\']([^"\']+)'
                  ):
                      api_bases += re.findall(
                          pattern, source
                      )

              except Exception as error:
                  print("Script error:", error)

          for match in re.finditer(
              r'.{0,100}APIBASE.{0,160}',
              html
          ):
              print(
                  "Page API reference:",
                  match.group(0)[:260]
              )

          api_bases += re.findall(
              r'APIBASE\s*=\s*["\']([^"\']+)',
              html
          )

          candidates = [
              base for base in api_bases
              if base.startswith("http")
          ]

          candidates += [
              SITE + "/sgt-api/",
              SITE + "/api/"
          ]

          candidates = list(dict.fromkeys(
              base.rstrip("/") + "/"
              for base in candidates
          ))

          print("\nAPI candidates:", candidates)

          for name, tour_id in TOURS.items():
              print(
                  "\n=== TOUR:",
                  name, tour_id, "==="
              )

              for base in candidates:
                  url = (
                      base +
                      f"tour/{tour_id}/events"
                  )

                  print("\nTrying:", url)

                  try:
                      status, ctype, body = fetch(url)

                      print("HTTP:", status)
                      print("Content type:", ctype)
                      print("Length:", len(body))
                      print("Response preview:")
                      print(body[:6000])

                      try:
                          data = json.loads(body)
                          print(
                              "JSON structure:",
                              type(data).__name__
                          )
                          if isinstance(data, dict):
                              print(
                                  "JSON keys:",
                                  list(data.keys())
                              )
                      except ValueError:
                          print(
                              "Response is not JSON"
                          )

                  except Exception as error:
                      print("Request failed:", error)

          print("\nDISCOVERY TEST COMPLETE")
          PY
