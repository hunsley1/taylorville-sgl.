
name: Test SGT Par 3 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-par3:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Inspect closest-to-pin HTML
        run: |
          python3 - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup

          SITE = "https://simulatorgolftour.com"

          for tid in (82721, 82722, 83767):
              print(
                  f"\n=== TOURNAMENT {tid} ===",
                  flush=True
              )

              url = (
                  f"{SITE}/sgt-api/leaderboard/"
                  f"{tid}/ctp"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html,*/*",
                      "Referer": SITE + "/"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", "replace"
                  )

              soup = BeautifulSoup(
                  html, "html.parser"
              )

              # Find the actual HTML containers
              # holding player names and distances.
              for tag in soup.find_all(
                  string=lambda s: (
                      s and (
                          "5.17" in s
                          or "8.53" in s
                          or "12.83" in s
                      )
                  )
              )[:8]:
                  parent = tag.parent

                  print(
                      "\nSHOT ELEMENT:",
                      str(parent)[:1200],
                      flush=True
                  )

                  if parent.parent:
                      print(
                          "PARENT CONTAINER:",
                          str(parent.parent)[:2500],
                          flush=True
                      )

              print(
                  "\nHTML FIRST 5000 CHARACTERS:",
                  html[:5000],
                  flush=True
              )

          print("\nINSPECTION COMPLETE")
          PY
