name: SGT Automatic Gross Skins Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: sgt-gross-skins-import
  cancel-in-progress: false

jobs:
  import-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Import and calculate gross skins
        env:
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          from bs4 import BeautifulSoup

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          SGT = "https://simulatorgolftour.com"

          ALIASES = {
              "mikefnhoncho47": "MIKEFNHONCH047"
          }

          if not KEY:
              raise RuntimeError(
                  "Missing Supabase service role secret"
              )

          def db(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = "application/json"
                  headers["Prefer"] = "return=representation"

              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          BASE + "/rest/v1/" + path,
                          data=body,
                          headers=headers,
                          method=method
                      )

                      with urllib.request.urlopen(
                          request, timeout=40
                      ) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else []

                  except urllib.error.HTTPError as error:
                      detail = error.read().decode(
                          "utf-8", "replace"
                      )

                      print(
                          f"Supabase HTTP {error.code}: "
                          f"{detail[:500]}",
                          flush=True
                      )

                      if error.code not in (
                          408, 429, 500, 502, 503, 504
                      ):
                          raise

                      if attempt == 2:
                          raise

                  except Exception as error:
                      print(
                          f"Supabase attempt "
                          f"{attempt + 1}: {error}",
                          flush=True
                      )

                      if attempt == 2:
                          raise

                  time.sleep(3 * (attempt + 1))

          def read_rows(table, params, order):
              rows = []
              offset = 0

              while True:
                  query = dict(params)
                  query["order"] = order
                  query["limit"] = 500
                  query["offset"] = offset

                  page = db(
                      table + "?" +
                      urllib.parse.urlencode(query)
                  )

                  if not page:
                      break

                  rows.extend(page)
                  offset += len(page)

              return rows

          def fetch(path):
              url = SGT + path
              last_error = None

              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "text/html,*/*",
                              "Referer": SGT + "/"
                          }
                      )

                      with urllib.request.urlopen(
                          request, timeout=40
                      ) as response:
                          return BeautifulSoup(
                              response.read(),
                              "html.parser"
                          )

                  except Exception as error:
                      last_error = error

                      print(
                          f"Retry {attempt + 1}: "
                          f"{url}: {error}",
                          flush=True
                      )

                      if attempt < 2:
                          time.sleep(3 * (attempt + 1))

              raise RuntimeError(str(last_error))

          def normalize(value):
              return " ".join(
                  str(value).casefold().split()
              )

          sessions = db(
              "sgl_sessions?"
              "select=id,session_name,total_weeks"
              "&status=eq.active"
          )

          if not sessions:
              print(
                  "No active session. Nothing to import.",
                  flush=True
              )
              raise SystemExit(0)

          if len(sessions) != 1:
              raise RuntimeError(
                  "Expected exactly one active session"
              )

          session = sessions[0]
          session_id = int(session["id"])

          print(
              "=== AUTOMATIC GROSS SKINS IMPORT ===",
              flush=True
          )

          print(
              f"Active session: {session['session_name']}",
              flush=True
          )

          print(
              f"Session ID: {session_id}",
              flush=True
          )

          print(
              f"Total weeks: {session['total_weeks']}",
              flush=True
          )

          print(
              "Database save mode: Atomic RPC",
              flush=True
          )

          players = read_rows(
              "sgl_players",
              {
                  "select": "username",
                  "session_id": f"eq.{session_id}"
              },
              "username.asc"
          )

          roster = {}

          for player in players:
              username = player["username"]
              key = normalize(username)

              if key in roster:
                  raise RuntimeError(
                      f"Duplicate roster name: {username}"
                  )

              roster[key] = username

          weeks = read_rows(
              "sgl_weeks",
              {
                  "select": (
                      "week_number,"
                      "tournament_1_id,"
                      "tournament_2_id,"
                      "finalized"
                  ),
                  "session_id": f"eq.{session_id}"
              },
              "week_number.asc"
          )

          if not roster or not weeks:
              raise RuntimeError(
                  "Missing players or weeks"
              )

          existing_cards = read_rows(
              "sgl_skins_player_scores",
              {
                  "select": (
                      "week_number,username,"
                      "tournament_id,scorecard_id,"
                      "gross_total,hole_scores"
                  ),
                  "session_id": f"eq.{session_id}"
              },
              "week_number.asc,username.asc"
          )

          existing_skins = read_rows(
              "sgl_skins",
              {
                  "select": "week_number,hole_number",
                  "session_id": f"eq.{session_id}"
              },
              "week_number.asc,hole_number.asc"
          )

          print(
              f"Loaded {len(roster)} players, "
              f"{len(weeks)} weeks, "
              f"{len(existing_cards)} existing scorecards "
              f"and {len(existing_skins)} skins results",
              flush=True
          )

          def match_player(name):
              key = normalize(name)

              if key in roster:
                  return roster[key]

              alias = ALIASES.get(key)

              if alias:
                  return roster.get(normalize(alias))

              return None

          def get_scores(tid, pid):
              soup = fetch(
                  f"/sgt-api/scorecard/"
                  f"{tid}/{pid}/indv"
              )

              for row in soup.select("tr"):
                  cells = row.find_all(
                      ["th", "td"],
                      recursive=False
                  )

                  if not cells:
                      continue

                  label = cells[0].get_text(
                      " ", strip=True
                  ).upper()

                  if label != "GROSS":
                      continue

                  values = [
                      c.get_text(" ", strip=True)
                      for c in cells[1:]
                  ]

                  if len(values) != 21:
                      raise ValueError(
                          f"Expected 21 score columns, "
                          f"got {len(values)}"
                      )

                  indices = (
                      list(range(9))
                      + list(range(10, 19))
                  )

                  scores = [
                      int(values[i])
                      for i in indices
                  ]

                  total = int(values[20])

                  if any(score < 1 for score in scores):
                      raise ValueError(
                          "Invalid hole score"
                      )

                  if sum(scores) != total:
                      raise ValueError(
                          "Gross score total mismatch"
                      )

                  return scores, total

              raise ValueError("GROSS row missing")

          def get_tournament_players(tid):
              soup = fetch(
                  f"/sgt-api/leaderboard/{tid}"
              )

              found = {}

              finished_rows = soup.select(
                  "tr.finished-card"
              )

              print(
                  f"Tournament {tid}: "
                  f"{len(finished_rows)} finished players",
                  flush=True
              )

              for row in finished_rows:
                  raw_name = row.get(
                      "data-player-name", ""
                  )

                  username = match_player(raw_name)

                  if not username:
                      print(
                          f"Skipping non-league player: "
                          f"{raw_name}",
                          flush=True
                      )
                      continue

                  link = row.select_one(
                      f'a[href^="/scorecard/{tid}/"]'
                  )

                  if link is None:
                      raise ValueError(
                          f"Missing scorecard: {raw_name}"
                      )

                  match = re.fullmatch(
                      rf"/scorecard/{re.escape(tid)}/"
                      r"(\d+)/?",
                      link["href"]
                  )

                  if not match:
                      raise ValueError(
                          f"Invalid scorecard link: "
                          f"{link['href']}"
                      )

                  if username in found:
                      raise ValueError(
                          f"Duplicate player: {username}"
                      )

                  found[username] = match.group(1)

              if finished_rows and not found:
                  raise RuntimeError(
                      f"Tournament {tid}: "
                      "No finished players matched roster"
                  )

              return found

          def calculate_skins(number, scorecards):
              results = []
              carry = 0

              for hole in range(18):
                  best = min(
                      card["hole_scores"][hole]
                      for card in scorecards
                  )

                  winners = [
                      card["username"]
                      for card in scorecards
                      if card["hole_scores"][hole] == best
                  ]

                  if len(winners) == 1:
                      results.append({
                          "session_id": session_id,
                          "week_number": number,
                          "hole_number": hole + 1,
                          "winner_username": winners[0],
                          "winning_score": best,
                          "skins_awarded": carry + 1,
                          "carryover": 0,
                          "is_tied": False
                      })

                      carry = 0

                  else:
                      carry += 1

                      results.append({
                          "session_id": session_id,
                          "week_number": number,
                          "hole_number": hole + 1,
                          "winner_username": None,
                          "winning_score": best,
                          "skins_awarded": 0,
                          "carryover": carry,
                          "is_tied": True
                      })

              return results

          def verify_week_open(number, tids):
              active = db(
                  "sgl_sessions?"
                  "select=id"
                  f"&id=eq.{session_id}"
                  "&status=eq.active"
              )

              if len(active) != 1:
                  return False

              current = db(
                  "sgl_weeks?"
                  "select=finalized,"
                  "tournament_1_id,tournament_2_id"
                  f"&session_id=eq.{session_id}"
                  f"&week_number=eq.{number}"
              )

              if len(current) != 1:
                  return False

              row = current[0]

              if row["finalized"]:
                  return False

              current_ids = [
                  str(row[field]).strip()
                  for field in (
                      "tournament_1_id",
                      "tournament_2_id"
                  )
                  if row.get(field) is not None
              ]

              return current_ids == tids

          failures = 0
          total_cards = 0
          total_skins = 0
          weeks_updated = 0

          for week in weeks:
              number = week["week_number"]

              if week["finalized"]:
                  print(
                      f"Week {number}: "
                      "Finalized. Protected.",
                      flush=True
                  )
                  continue

              tids = []

              for field in (
                  "tournament_1_id",
                  "tournament_2_id"
              ):
                  value = week.get(field)

                  if value is not None:
                      tid = str(value).strip()

                      if tid and tid not in tids:
                          tids.append(tid)

              if len(tids) != 2:
                  print(
                      f"Week {number}: "
                      "Waiting for both tournaments",
                      flush=True
                  )
                  continue

              print(
                  f"\n=== {session['session_name']} "
                  f"WEEK {number} ===",
                  flush=True
              )

              try:
                  discovered = {}

                  for tid in tids:
                      found = get_tournament_players(tid)

                      for username, pid in found.items():
                          if username in discovered:
                              raise ValueError(
                                  "Player appears in both "
                                  f"tournaments: {username}"
                              )

                          discovered[username] = (
                              tid, pid
                          )

                  previous_cards = [
                      card for card in existing_cards
                      if card["week_number"] == number
                  ]

                  missing_players = {
                      card["username"]
                      for card in previous_cards
                  } - set(discovered)

                  if missing_players:
                      raise RuntimeError(
                          "Previously imported players "
                          "missing from SGT: "
                          + ", ".join(
                              sorted(missing_players)
                          )
                      )

                  if not discovered:
                      print(
                          "No finished players",
                          flush=True
                      )
                      continue

                  scorecards = []

                  for username, (tid, pid) in (
                      sorted(discovered.items())
                  ):
                      scores, total = get_scores(
                          tid, pid
                      )

                      scorecards.append({
                          "session_id": session_id,
                          "week_number": number,
                          "username": username,
                          "tournament_id": tid,
                          "scorecard_id": pid,
                          "gross_total": total,
                          "hole_scores": scores
                      })

                      print(
                          f"{username}: {total}",
                          flush=True
                      )

                  results = calculate_skins(
                      number, scorecards
                  )

                  if len(results) != 18:
                      raise RuntimeError(
                          "Expected 18 skins results"
                      )

                  if not verify_week_open(number, tids):
                      raise RuntimeError(
                          "Session or week changed "
                          "during import"
                      )

                  # Save scorecards and skins together
                  # using one database transaction.

                  saved = db(
                      "rpc/sgl_save_weekly_skins",
                      method="POST",
                      data={
                          "p_session_id": session_id,
                          "p_week_number": number,
                          "p_scorecards": scorecards,
                          "p_results": results
                      }
                  )

                  if not isinstance(saved, dict):
                      raise RuntimeError(
                          "Unexpected RPC response"
                      )

                  cards_saved = int(
                      saved.get("scorecards_saved", -1)
                  )

                  skins_saved = int(
                      saved.get("skins_saved", -1)
                  )

                  if (
                      int(saved.get("session_id", -1))
                      != session_id
                      or int(saved.get("week_number", -1))
                      != number
                      or cards_saved != len(scorecards)
                      or skins_saved != 18
                  ):
                      raise RuntimeError(
                          "Atomic save confirmation mismatch"
                      )

                  total_cards += cards_saved
                  total_skins += skins_saved
                  weeks_updated += 1

                  awarded = sum(
                      row["skins_awarded"]
                      for row in results
                  )

                  remaining = results[-1]["carryover"]

                  print(
                      f"Week {number}: "
                      f"{cards_saved} scorecards and "
                      f"{skins_saved} skins results "
                      "saved atomically",
                      flush=True
                  )

                  print(
                      f"Skins awarded: {awarded}, "
                      f"Unclaimed final carryover: "
                      f"{remaining}",
                      flush=True
                  )

              except Exception as error:
                  failures += 1

                  print(
                      f"ERROR Week {number}: {error}",
                      flush=True
                  )

          print(
              f"\nSESSION: {session['session_name']}",
              flush=True
          )

          print(
              f"SKINS IMPORT COMPLETE: "
              f"{weeks_updated} weeks updated, "
              f"{total_cards} scorecard upserts, "
              f"{total_skins} skins upserts, "
              f"{failures} failures",
              flush=True
          )

          if failures:
              raise SystemExit(
                  f"{failures} week(s) failed"
              )

          PY
