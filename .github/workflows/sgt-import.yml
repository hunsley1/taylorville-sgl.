
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  import-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Install scorecard reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python3 -m pip install --quiet pillow pytesseract

      - name: Import SGT scores and handicaps
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser

          from PIL import Image, ImageEnhance, ImageOps
          import pytesseract

          BASE = os.environ['SUPABASE_URL'].rstrip('/')
          KEY = os.environ['SUPABASE_KEY']
          SGT = 'https://simulatorgolftour.com'

          ALIASES = {
              'mikefnhoncho47': 'MIKEFNHONCH047'
          }

          def api(path, method='GET', data=None):
              headers = {
                  'apikey': KEY,
                  'Authorization': f'Bearer {KEY}',
                  'Accept': 'application/json',
              }
              body = None
              if data is not None:
                  body = json.dumps(data).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
                  headers['Prefer'] = (
                      'resolution=merge-duplicates,'
                      'return=representation'
                  )
              req = urllib.request.Request(
                  BASE + '/rest/v1/' + path,
                  data=body,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else []

          def fetch(url, binary=False):
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'Mozilla/5.0',
                              'Accept': '*/*',
                              'Referer': SGT + '/',
                          },
                      )
                      with urllib.request.urlopen(
                          req, timeout=30
                      ) as response:
                          data = response.read()
                      return (
                          data if binary
                          else data.decode('utf-8', 'replace')
                      )
                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      ConnectionError
                  ) as error:
                      print(
                          f'Request {attempt}/3 failed: '
                          f'{url}: {error}',
                          flush=True
                      )
                      if attempt < 3:
                          time.sleep(5 * attempt)
              return None

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in ('img', 'a'):
                      for key in ('src', 'href', 'data-src'):
                          value = attrs.get(key, '')
                          if (
                              'scorecard' in value.lower()
                              and re.search(
                                  r'\.(?:png|jpe?g|webp)'
                                  r'(?:[?#]|$)',
                                  value, re.I
                              )
                          ):
                              self.images.append(value)
                  if tag == 'tr':
                      self.row = []
                  elif (
                      tag in ('td', 'th')
                      and self.row is not None
                  ):
                      self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None:
                      self.row.append(
                          unescape(
                              ' '.join(
                                  ''.join(self.cell).split()
                              )
                          )
                      )
                      self.cell = None
                  elif tag == 'tr':
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          def get_scorecard(tournament):
              url = f'{SGT}/tournament/{tournament}'
              html = fetch(url)
              if html is None:
                  return None
              parser = PageParser()
              parser.feed(html)
              for link in dict.fromkeys(parser.images):
                  image_url = urllib.parse.urljoin(
                      url, unescape(link)
                  )
                  data = fetch(image_url, binary=True)
                  if data is None:
                      continue
                  try:
                      image = Image.open(io.BytesIO(data))
                      image.load()
                      return image.convert('RGB')
                  except Exception as error:
                      print(
                          f'Invalid scorecard: {error}',
                          flush=True
                      )
              return None

          def detect_par(image):
              width, height = image.size
              regions = [
                  image,
                  image.crop((
                      0, int(height * .65),
                      int(width * .55), height
                  )),
              ]
              candidates = []
              for region in regions:
                  gray = ImageOps.grayscale(region)
                  gray = ImageEnhance.Contrast(gray).enhance(2)
                  gray = gray.resize((
                      gray.width * 3,
                      gray.height * 3
                  ))
                  result = pytesseract.image_to_string(
                      gray, config='--psm 6'
                  )
                  found = []
                  for line in result.upper().splitlines():
                      match = re.search(
                          r'\bTOTAL\b\s+(6\d|7[0-5])\b',
                          line
                      )
                      if match:
                          found.append(int(match.group(1)))
                  candidates.append(found)
              print(
                  f'OCR par candidates: {candidates}',
                  flush=True
              )
              if (
                  all(len(c) == 1 for c in candidates)
                  and candidates[0] == candidates[1]
              ):
                  return candidates[0][0]
              return None

          def get_rows(tournament, kind):
              url = (
                  f'{SGT}/embed/tournament/'
                  f'{tournament}/standings/'
                  f'{kind}?theme=dark'
              )
              html = fetch(url)
              if html is None:
                  return None
              parser = PageParser()
              parser.feed(html)
              print(
                  f'SGT {kind} tournament '
                  f'{tournament}: {len(parser.rows)} rows',
                  flush=True
              )
              return parser.rows[1:]

          def relative_score(value):
              match = re.search(
                  r'(?<!\d)([+-]\d+|E)(?!\d)',
                  value.upper()
              )
              if not match:
                  return None
              return (
                  0 if match.group(1) == 'E'
                  else int(match.group(1))
              )

          players = api('sgl_players?select=username')
          roster = {
              p['username'].strip().casefold():
              p['username']
              for p in players
          }

          weeks = api(
              'sgl_weeks?select='
              'week_number,tournament_1_id,'
              'tournament_2_id,course_par'
              '&order=week_number.asc'
          )

          print(
              f'Loaded {len(roster)} players '
              f'and {len(weeks)} weeks',
              flush=True
          )

          def match_player(raw):
              name = ' '.join(raw.split()).casefold()
              candidates = [name]
              match = re.fullmatch(
                  r'(.+?)\s+[-+]?\d+(?:\.\d+)?',
                  name
              )
              if match:
                  candidates.append(match.group(1))

              for candidate in candidates:
                  actual = roster.get(candidate)
                  if actual:
                      return actual
                  alias = ALIASES.get(candidate)
                  if alias and alias.casefold() in roster:
                      return roster[alias.casefold()]
              return None

          def extract_handicap(raw):
              match = re.fullmatch(
                  r'.+?\s+([-+]?\d+(?:\.\d+)?)',
                  ' '.join(raw.split())
              )
              if not match:
                  return None
              return float(match.group(1))

          def is_finished(row):
              return (
                  len(row) >= 4
                  and bool(re.search(r'\bF\b', row[2]))
              )

          def collect(rows, kind):
              scores = {}
              handicaps = {}

              for row in rows:
                  if len(row) < 4:
                      continue

                  player = match_player(row[1])
                  if player is None:
                      print(
                          f'Unmatched {kind} player: '
                          f'{row[1]!r}',
                          flush=True
                      )
                      continue

                  if kind == 'net':
                      handicap = extract_handicap(row[1])
                      if handicap is not None:
                          handicaps[player] = handicap

                  if not is_finished(row):
                      continue

                  score = relative_score(row[3])
                  if score is None:
                      print(
                          f'Unreadable {kind} score: '
                          f'{player}: {row[3]!r}',
                          flush=True
                      )
                      continue

                  scores[player] = score

              return scores, handicaps

          total_scores = 0
          total_handicaps = 0
          failures = 0

          for week in weeks:
              number = week['week_number']
              tournaments = list(dict.fromkeys(
                  str(week[field]).strip()
                  for field in (
                      'tournament_1_id',
                      'tournament_2_id'
                  )
                  if (
                      week.get(field) is not None
                      and str(week[field]).strip()
                  )
              ))

              if not tournaments:
                  print(
                      f'Week {number}: no tournaments',
                      flush=True
                  )
                  continue

              print(
                  f'Week {number}: {tournaments}',
                  flush=True
              )

              try:
                  image = get_scorecard(tournaments[0])
                  par = (
                      detect_par(image)
                      if image is not None
                      else None
                  )

                  if par is None:
                      print(
                          f'Week {number}: '
                          'existing par preserved',
                          flush=True
                      )
                  elif par != week.get('course_par'):
                      path = (
                          'sgl_weeks?'
                          + urllib.parse.urlencode({
                              'week_number': f'eq.{number}'
                          })
                      )
                      updated = api(
                          path,
                          method='PATCH',
                          data={'course_par': par}
                      )
                      if (
                          len(updated) != 1
                          or updated[0].get('course_par') != par
                      ):
                          raise RuntimeError(
                              'Par update unconfirmed'
                          )
                      print(
                          f'Week {number}: par {par}',
                          flush=True
                      )
              except Exception as error:
                  print(
                      f'Week {number}: par check '
                      f'failed: {error}',
                      flush=True
                  )

              seen_players = set()

              for tournament in tournaments:
                  gross_rows = get_rows(
                      tournament, 'gross'
                  )
                  net_rows = get_rows(
                      tournament, 'net'
                  )

                  if (
                      gross_rows is None
                      or net_rows is None
                  ):
                      failures += 1
                      print(
                          f'Week {number}, tournament '
                          f'{tournament}: unavailable; '
                          'existing data preserved',
                          flush=True
                      )
                      continue

                  gross, _ = collect(
                      gross_rows, 'gross'
                  )
                  net, handicaps = collect(
                      net_rows, 'net'
                  )

                  # Save finished scores normally.
                  finished_players = sorted(
                      set(gross) & set(net)
                  )

                  for player in finished_players:
                      if player in seen_players:
                          raise RuntimeError(
                              f'Duplicate golfer in Week '
                              f'{number}: {player}'
                          )
                      seen_players.add(player)

                      record = {
                          'week_number': number,
                          'username': player,
                          'gross_relative': gross[player],
                          'net_relative': net[player],
                          'status': 'played',
                      }

                      if player in handicaps:
                          record['handicap'] = (
                              handicaps[player]
                          )

                      api(
                          'sgl_scores?on_conflict='
                          'username,week_number',
                          method='POST',
                          data=[record]
                      )

                      total_scores += 1
                      if player in handicaps:
                          total_handicaps += 1

                      print(
                          f'Saved Week {number}: '
                          f'{player}, '
                          f'gross {gross[player]:+d}, '
                          f'net {net[player]:+d}, '
                          f'handicap '
                          f'{handicaps.get(player)}',
                          flush=True
                      )

                  # Handicap-only records must not
                  # be marked as completed rounds.
                  for player, handicap in handicaps.items():
                      if player in finished_players:
                          continue

                      if player in seen_players:
                          raise RuntimeError(
                              f'Duplicate golfer in Week '
                              f'{number}: {player}'
                          )
                      seen_players.add(player)

                      record = {
                          'week_number': number,
                          'username': player,
                          'handicap': handicap,
                      }

                      api(
                          'sgl_scores?on_conflict='
                          'username,week_number',
                          method='POST',
                          data=[record]
                      )

                      total_handicaps += 1
                      print(
                          f'Saved handicap Week '
                          f'{number}: {player}, '
                          f'{handicap:g}',
                          flush=True
                      )

                  print(
                      f'Week {number}, tournament '
                      f'{tournament}: '
                      f'{len(finished_players)} '
                      f'completed golfers, '
                      f'{len(handicaps)} handicaps',
                      flush=True
                  )

          print(
              f'Import complete: '
              f'{total_scores} score upserts, '
              f'{total_handicaps} handicap upserts, '
              f'{failures} unavailable tournaments',
              flush=True
          )

          if failures:
              raise SystemExit(
                  'Some SGT requests failed. '
                  'Existing data was preserved.'
              )
          PY
