
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  import-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Install scorecard reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python3 -m pip install --quiet pillow pytesseract

      - name: Import SGT scores and detect course par
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser

          from PIL import Image, ImageEnhance, ImageOps
          import pytesseract

          BASE = os.environ['SUPABASE_URL'].rstrip('/')
          KEY = os.environ['SUPABASE_KEY']
          SGT = 'https://simulatorgolftour.com'
          ALIASES = {'mikefnhoncho47': 'MIKEFNHONCH047'}

          def api(path, method='GET', data=None):
              headers = {
                  'apikey': KEY,
                  'Authorization': f'Bearer {KEY}',
                  'Accept': 'application/json',
              }
              body = None
              if data is not None:
                  body = json.dumps(data).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
                  headers['Prefer'] = 'resolution=merge-duplicates,return=representation'
              request = urllib.request.Request(
                  BASE + '/rest/v1/' + path, data=body,
                  headers=headers, method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else []

          def fetch(url, binary=False):
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0',
                          'Accept': '*/*',
                          'Referer': SGT + '/',
                      })
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = response.read()
                      return data if binary else data.decode('utf-8', 'replace')
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      print(f'Request {attempt}/3 failed for {url}: {error}', flush=True)
                      if attempt < 3:
                          time.sleep(5 * attempt)
              return None

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in ('img', 'a'):
                      for key in ('src', 'href', 'data-src'):
                          value = attrs.get(key, '')
                          if 'scorecard' in value.lower() and re.search(r'\.(?:png|jpe?g|webp)(?:[?#]|$)', value, re.I):
                              self.images.append(value)
                  if tag == 'tr':
                      self.row = []
                  elif tag in ('td', 'th') and self.row is not None:
                      self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.cell is not None:
                      self.row.append(unescape(' '.join(''.join(self.cell).split())))
                      self.cell = None
                  elif tag == 'tr':
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          def get_scorecard(tournament):
              page_url = f'{SGT}/tournament/{tournament}'
              html = fetch(page_url)
              if html is None:
                  return None
              parser = PageParser()
              parser.feed(html)
              for link in dict.fromkeys(parser.images):
                  url = urllib.parse.urljoin(page_url, unescape(link))
                  data = fetch(url, binary=True)
                  if data is None:
                      continue
                  try:
                      image = Image.open(io.BytesIO(data))
                      image.load()
                      print(f'Scorecard downloaded for {tournament}: {image.size}', flush=True)
                      return image.convert('RGB')
                  except Exception as error:
                      print(f'Invalid scorecard image: {error}', flush=True)
              return None

          def detect_par(image):
              width, height = image.size
              regions = [
                  image,
                  image.crop((0, int(height * .65), int(width * .55), height)),
              ]
              candidates = []
              for region in regions:
                  gray = ImageOps.grayscale(region)
                  gray = ImageEnhance.Contrast(gray).enhance(2)
                  gray = gray.resize((gray.width * 3, gray.height * 3))
                  result = pytesseract.image_to_string(gray, config='--psm 6')
                  found = []
                  for line in result.upper().splitlines():
                      match = re.search(r'\bTOTAL\b\s+(6\d|7[0-5])\b', line)
                      if match:
                          found.append(int(match.group(1)))
                  candidates.append(found)
              print(f'OCR par candidates: {candidates}', flush=True)
              if all(len(c) == 1 for c in candidates) and candidates[0] == candidates[1]:
                  return candidates[0][0]
              return None

          def get_rows(tournament, kind):
              url = f'{SGT}/embed/tournament/{tournament}/standings/{kind}?theme=dark'
              html = fetch(url)
              if html is None:
                  return None
              parser = PageParser()
              parser.feed(html)
              print(f'SGT {kind} tournament {tournament}: {len(parser.rows)} rows', flush=True)
              return parser.rows[1:]

          def relative_score(value):
              match = re.search(r'(?<!\d)([+-]\d+|E)(?!\d)', value.upper())
              if not match:
                  return None
              return 0 if match.group(1) == 'E' else int(match.group(1))

          players = api('sgl_players?select=username')
          roster = {p['username'].strip().casefold(): p['username'] for p in players}
          weeks = api('sgl_weeks?select=week_number,tournament_1_id,tournament_2_id,course_par&order=week_number.asc')
          print(f'Loaded {len(roster)} players and {len(weeks)} weeks', flush=True)

          def match_player(raw):
              name = ' '.join(raw.split()).casefold()
              candidates = [name]
              handicap = re.fullmatch(r'(.+?)\s+[-+]?\d+', name)
              if handicap:
                  candidates.append(handicap.group(1))
              for candidate in candidates:
                  actual = roster.get(candidate)
                  if actual:
                      return actual
                  alias = ALIASES.get(candidate)
                  if alias and alias.casefold() in roster:
                      return roster[alias.casefold()]
              return None

          def collect(rows, kind):
              scores = {}
              for row in rows:
                  if len(row) < 4 or not re.search(r'\bF\b', row[2]):
                      continue
                  player = match_player(row[1])
                  score = relative_score(row[3])
                  if player is None:
                      print(f'Unmatched {kind} player: {row[1]!r}', flush=True)
                  elif score is None:
                      print(f'Unreadable {kind} score: {player}: {row[3]!r}', flush=True)
                  else:
                      scores[player] = score
              return scores

          total = 0
          failures = 0
          for week in weeks:
              number = week['week_number']
              tournaments = list(dict.fromkeys(
                  str(week[field]).strip()
                  for field in ('tournament_1_id', 'tournament_2_id')
                  if week.get(field) is not None and str(week[field]).strip()
              ))
              if not tournaments:
                  print(f'Week {number}: no tournament IDs, skipping', flush=True)
                  continue
              print(f'Week {number}: tournaments {tournaments}', flush=True)

              # Both league tournaments should use the same course.
              # Preserve existing par when detection is uncertain.
              try:
                  image = get_scorecard(tournaments[0])
                  par = detect_par(image) if image is not None else None
                  if par is None:
                      print(f'Week {number}: par unverified; existing par preserved', flush=True)
                  elif par == week.get('course_par'):
                      print(f'Week {number}: confirmed existing par {par}', flush=True)
                  else:
                      path = 'sgl_weeks?' + urllib.parse.urlencode({'week_number': f'eq.{number}'})
                      updated = api(path, method='PATCH', data={'course_par': par})
                      if len(updated) != 1 or updated[0].get('course_par') != par:
                          raise RuntimeError('Par update was not confirmed')
                      print(f'Week {number}: course par updated to {par}', flush=True)
              except Exception as error:
                  print(f'Week {number}: par check failed ({error}); scores will continue', flush=True)

              for tournament in tournaments:
                  gross_rows = get_rows(tournament, 'gross')
                  net_rows = get_rows(tournament, 'net')
                  if gross_rows is None or net_rows is None:
                      failures += 1
                      print(f'Week {number}, tournament {tournament}: unavailable; existing scores preserved', flush=True)
                      continue
                  gross = collect(gross_rows, 'gross')
                  net = collect(net_rows, 'net')
                  matched = sorted(set(gross) & set(net))
                  for player in matched:
                      record = {
                          'week_number': number,
                          'username': player,
                          'gross_relative': gross[player],
                          'net_relative': net[player],
                          'status': 'played',
                      }
                      api('sgl_scores?on_conflict=username,week_number', method='POST', data=[record])
                      total += 1
                      print(f'Saved Week {number}: {player}, gross {gross[player]:+d}, net {net[player]:+d}', flush=True)
                  print(f'Week {number}, tournament {tournament}: {len(matched)} matched players', flush=True)

          print(f'Import complete: {total} score upserts, {failures} unavailable tournaments', flush=True)
          if failures:
              raise SystemExit('Some SGT requests failed. Existing scores were not deleted.')
          PY
