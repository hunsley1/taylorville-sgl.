
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  check-sgt:
    runs-on: ubuntu-latest

    steps:
      - name: Check SGT leaderboard
        env:
          TOURNAMENT_ID: "83767"
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          tournament = os.environ["TOURNAMENT_ID"]
          url = (
              "https://simulatorgolftour.com/"
              f"embed/tournament/{tournament}/standings/gross"
              "?theme=dark"
          )

          print("Checking SGT tournament:", tournament)

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("HTTP status:", response.status)
                  print("Response length:", len(html))
                  print("Contains Mason:", "mason" in html.lower())
                  print("First 1000 characters:")
                  print(html[:1000])
          except Exception as error:
              print("SGT request failed:", error)
              raise
          PY
