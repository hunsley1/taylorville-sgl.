
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  check-sgt:
    runs-on: ubuntu-latest

    steps:
      - name: Extract all SGT scores
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser

          TOURNAMENT_ID = "83767"

          class TableReader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th"):
                      if self.row is not None:
                          self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          value = " ".join(
                              "".join(self.cell).split()
                          )
                          self.row.append(unescape(value))
                          self.cell = None
                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          for score_type in ("gross", "net"):
              url = (
                  "https://simulatorgolftour.com/"
                  f"embed/tournament/{TOURNAMENT_ID}/"
                  f"standings/{score_type}?theme=dark"
              )

              print(f"\n=== {score_type.upper()} ===")

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )

              parser = TableReader()
              parser.feed(html)

              print("HTTP status: 200")
              print("Rows found:", len(parser.rows))

              for row in parser.rows:
                  print(" | ".join(row))

              if not parser.rows:
                  print("No HTML table rows found.")
                  print(
                      "HTML sample:",
                      re.sub(r"\s+", " ", html)[:600]
                  )
          PY
