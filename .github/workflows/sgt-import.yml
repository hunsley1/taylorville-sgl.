
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  import-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Import completed SGT scores
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          from html import unescape
          from html.parser import HTMLParser

          # Map league weeks to SGT tournaments.
          # Add future weeks here.
          TOURNAMENTS = {
              4: ["83767"],
          }

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ.get("SUPABASE_KEY", "")

          if not KEY:
              raise RuntimeError(
                  "Missing SUPABASE_SECRET_KEY GitHub secret"
              )

          def request_json(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Accept": "application/json",
              }

              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  headers["Prefer"] = (
                      "resolution=merge-duplicates,"
                      "return=representation"
                  )

              req = urllib.request.Request(
                  BASE + "/rest/v1/" + path,
                  data=body,
                  headers=headers,
                  method=method,
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  content = response.read()
                  return (
                      json.loads(content)
                      if content else []
                  )

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th"):
                      if self.row is not None:
                          self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          self.row.append(
                              unescape(
                                  " ".join(
                                      "".join(self.cell).split()
                                  )
                              )
                          )
                          self.cell = None
                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          def get_scores(tournament, kind):
              url = (
                  "https://simulatorgolftour.com/"
                  f"embed/tournament/{tournament}/"
                  f"standings/{kind}?theme=dark"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  },
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )

              parser = Reader()
              parser.feed(html)
              return parser.rows[1:]

          def relative_score(value):
              match = re.search(
                  r"(?<!\d)([+-]\d+|E)(?!\d)",
                  value.upper(),
              )
              if not match:
                  return None

              result = match.group(1)
              return 0 if result == "E" else int(result)

          def finished(row):
              return (
                  len(row) >= 4
                  and bool(
                      re.search(r"\bF\b", row[2])
                  )
              )

          players = request_json(
              "sgl_players?select=username"
          )

          roster = {
              p["username"].strip().casefold():
              p["username"]
              for p in players
          }

          def match_player(raw):
              name = " ".join(raw.split()).casefold()

              if name in roster:
                  return roster[name]

              # SGT net standings may append
              # a handicap, e.g. "Mason 8".
              matches = [
                  actual
                  for key, actual in roster.items()
                  if re.fullmatch(
                      re.escape(key) + r"\s+\d+",
                      name,
                  )
              ]

              return (
                  matches[0]
                  if len(matches) == 1
                  else None
              )

          def collect(rows):
              scores = {}

              for row in rows:
                  if len(row) < 4 or not finished(row):
                      continue

                  player = match_player(row[1])
                  score = relative_score(row[3])

                  if player is None:
                      print(
                          "Skipping unmatched player:",
                          row[1]
                      )
                      continue

                  if score is None:
                      print(
                          "Skipping unreadable score:",
                          player
                      )
                      continue

                  scores[player] = score

              return scores

          total = 0

          for week, tournament_ids in TOURNAMENTS.items():
              for tournament in tournament_ids:
                  print(
                      f"Checking Week {week}, "
                      f"tournament {tournament}"
                  )

                  gross = collect(
                      get_scores(tournament, "gross")
                  )
                  net = collect(
                      get_scores(tournament, "net")
                  )

                  for player in sorted(
                      set(gross) & set(net)
                  ):
                      record = {
                          "week_number": week,
                          "username": player,
                          "gross_relative": gross[player],
                          "net_relative": net[player],
                          "status": "played",
                      }

                      request_json(
                          "sgl_scores?"
                          "on_conflict=username,week_number",
                          method="POST",
                          data=[record],
                      )

                      total += 1
                      print(
                          f"Saved Week {week}: "
                          f"{player}, "
                          f"gross {gross[player]:+d}, "
                          f"net {net[player]:+d}"
                      )

                  print(
                      f"Matched completed players: "
                      f"{len(set(gross) & set(net))}"
                  )

          print(f"Import complete: {total} scores")
          PY
