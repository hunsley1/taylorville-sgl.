
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: sgt-score-import
  cancel-in-progress: false

jobs:
  import-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Import completed SGT scores
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          from bs4 import BeautifulSoup

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ.get("SUPABASE_KEY", "")
          SGT = "https://simulatorgolftour.com"

          ALIASES = {
              "mikefnhoncho47": "MIKEFNHONCH047"
          }

          if not KEY:
              raise RuntimeError(
                  "Missing Supabase service role secret"
              )

          def db(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = (
                      "application/json"
                  )
                  headers["Prefer"] = (
                      "resolution=merge-duplicates,"
                      "return=representation"
                  )

              request = urllib.request.Request(
                  BASE + "/rest/v1/" + path,
                  data=body,
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  content = response.read()
                  return (
                      json.loads(content)
                      if content else []
                  )

          def fetch(path):
              url = SGT + path
              last_error = None

              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "text/html,*/*",
                              "Referer": SGT + "/"
                          }
                      )

                      with urllib.request.urlopen(
                          request, timeout=25
                      ) as response:
                          return response.read().decode(
                              "utf-8", "replace"
                          )

                  except Exception as error:
                      last_error = error
                      print(
                          f"Request attempt {attempt+1} "
                          f"failed: {url}: {error}",
                          flush=True
                      )
                      if attempt < 2:
                          time.sleep(3 * (attempt+1))

              raise RuntimeError(
                  f"SGT unavailable: {last_error}"
              )

          def normalize(value):
              return " ".join(
                  str(value).casefold().split()
              )

          players = db(
              "sgl_players?select=username"
          )

          roster = {
              normalize(p["username"]): p["username"]
              for p in players
          }

          weeks = db(
              "sgl_weeks?select="
              "week_number,"
              "tournament_1_id,"
              "tournament_2_id,"
              "course_par"
              "&order=week_number.asc"
          )

          print(
              f"Loaded {len(roster)} players "
              f"and {len(weeks)} weeks",
              flush=True
          )

          if not roster or not weeks:
              raise RuntimeError(
                  "Missing players or weeks"
              )

          def match_player(name):
              key = normalize(name)

              if key in roster:
                  return roster[key]

              alias = ALIASES.get(key)

              if alias:
                  return roster.get(normalize(alias))

              return None

          def score_value(text):
              text = text.strip().upper()

              if text == "E":
                  return 0

              if re.fullmatch(r"[+-]\d+", text):
                  return int(text)

              return None

          def parse_leaderboard(html, tid, kind):
              soup = BeautifulSoup(
                  html, "html.parser"
              )

              finished_rows = soup.select(
                  "tr.finished-card"
              )

              all_named_rows = soup.select(
                  "tr[data-player-name]"
              )

              print(
                  f"{tid} {kind}: "
                  f"{len(finished_rows)} finished, "
                  f"{len(all_named_rows)} named rows",
                  flush=True
              )

              scores = {}
              handicaps = {}
              unmatched = set()

              for row in finished_rows:
                  raw_name = row.get(
                      "data-player-name", ""
                  ).strip()

                  player = match_player(raw_name)

                  if not player:
                      unmatched.add(raw_name)
                      continue

                  total_cell = row.select_one(
                      "td.total"
                  )

                  if total_cell is None:
                      raise RuntimeError(
                          f"{tid}: missing total "
                          f"for {raw_name}"
                      )

                  total_text = total_cell.get_text(
                      " ", strip=True
                  )

                  score = score_value(total_text)

                  if score is None:
                      raise RuntimeError(
                          f"{tid}: invalid {kind} "
                          f"total for {raw_name}: "
                          f"{total_text!r}"
                      )

                  if player in scores:
                      raise RuntimeError(
                          f"{tid}: duplicate "
                          f"player {player}"
                      )

                  scores[player] = score

                  # In the net leaderboard, SGT
                  # displays handicap next to
                  # the player's name.
                  if kind == "net":
                      player_cell = row.select_one(
                          "td.player"
                      )

                      if player_cell:
                          divs = player_cell.select(
                              "div.three-quarter-font"
                          )

                          for div in divs:
                              value = div.get_text(
                                  " ", strip=True
                              )

                              if re.fullmatch(
                                  r"[-+]?\d+(?:\.\d+)?",
                                  value
                              ):
                                  handicaps[player] = (
                                      float(value)
                                  )
                                  break

                  print(
                      f"{tid} {kind.upper()}: "
                      f"{player} {score:+d}",
                      flush=True
                  )

              for name in sorted(unmatched):
                  print(
                      f"Unmatched SGT player: "
                      f"{name}",
                      flush=True
                  )

              if finished_rows and not scores:
                  print(
                      f"WARNING: {tid} {kind} "
                      "has finished players but "
                      "none matched the roster",
                      flush=True
                  )

              return scores, handicaps

          def get_leaderboard(tid, kind):
              suffix = (
                  "/net" if kind == "net" else ""
              )

              html = fetch(
                  f"/sgt-api/leaderboard/"
                  f"{tid}{suffix}"
              )

              return parse_leaderboard(
                  html, tid, kind
              )

          def inspect_prizes(tid):
              for name, suffix in [
                  ("CTP", "ctp"),
                  ("LONG DRIVE", "ld")
              ]:
                  try:
                      html = fetch(
                          f"/sgt-api/leaderboard/"
                          f"{tid}/{suffix}"
                      )

                      soup = BeautifulSoup(
                          html, "html.parser"
                      )

                      text = soup.get_text(
                          " ", strip=True
                      )

                      print(
                          f"{tid} {name}: "
                          f"{text[:250]}",
                          flush=True
                      )

                  except Exception as error:
                      print(
                          f"{tid} {name} inspection "
                          f"failed: {error}",
                          flush=True
                      )

          total_saved = 0
          failures = 0

          for week in weeks:
              number = week["week_number"]

              tournaments = []

              for field in (
                  "tournament_1_id",
                  "tournament_2_id"
              ):
                  value = week.get(field)

                  if value is not None:
                      tid = str(value).strip()

                      if (
                          tid
                          and tid not in tournaments
                      ):
                          tournaments.append(tid)

              if not tournaments:
                  print(
                      f"Week {number}: "
                      "no tournaments configured",
                      flush=True
                  )
                  continue

              print(
                  "\n" + "=" * 55,
                  flush=True
              )
              print(
                  f"WEEK {number}: {tournaments}",
                  flush=True
              )

              records = {}
              week_failed = False

              for tid in tournaments:
                  try:
                      gross, _ = get_leaderboard(
                          tid, "gross"
                      )

                      net, handicaps = get_leaderboard(
                          tid, "net"
                      )

                      gross_names = set(gross)
                      net_names = set(net)

                      completed = (
                          gross_names & net_names
                      )

                      unpaired = (
                          gross_names ^ net_names
                      )

                      if unpaired:
                          raise RuntimeError(
                              f"{tid}: gross/net "
                              f"mismatch: "
                              f"{sorted(unpaired)}"
                          )

                      for player in sorted(completed):
                          if player in records:
                              raise RuntimeError(
                                  f"Week {number}: "
                                  f"duplicate player "
                                  f"{player} across "
                                  "tournaments"
                              )

                          record = {
                              "week_number": number,
                              "username": player,
                              "gross_relative":
                                  gross[player],
                              "net_relative":
                                  net[player],
                              "status": "played"
                          }

                          if player in handicaps:
                              record["handicap"] = (
                                  handicaps[player]
                              )

                          records[player] = record

                          print(
                              f"READY Week {number}: "
                              f"{player}, "
                              f"gross {gross[player]:+d}, "
                              f"net {net[player]:+d}, "
                              f"handicap "
                              f"{handicaps.get(player)}",
                              flush=True
                          )

                      inspect_prizes(tid)

                  except Exception as error:
                      week_failed = True
                      failures += 1

                      print(
                          f"ERROR Week {number}, "
                          f"tournament {tid}: "
                          f"{error}",
                          flush=True
                      )

              if week_failed:
                  print(
                      f"Week {number}: "
                      "no database writes "
                      "because a tournament failed",
                      flush=True
                  )
                  continue

              if not records:
                  print(
                      f"Week {number}: "
                      "no completed matched scores",
                      flush=True
                  )
                  continue

              # Separate records with handicaps
              # so the upsert uses consistent
              # columns within each batch.
              with_handicap = []
              without_handicap = []

              for record in records.values():
                  if "handicap" in record:
                      with_handicap.append(record)
                  else:
                      without_handicap.append(record)

              try:
                  for batch in (
                      with_handicap,
                      without_handicap
                  ):
                      if not batch:
                          continue

                      saved = db(
                          "sgl_scores?on_conflict="
                          "username,week_number",
                          method="POST",
                          data=batch
                      )

                      if len(saved) != len(batch):
                          raise RuntimeError(
                              "Supabase did not "
                              "confirm every record"
                          )

                      total_saved += len(saved)

                  print(
                      f"Week {number}: "
                      f"saved {len(records)} "
                      "completed scores",
                      flush=True
                  )

              except Exception as error:
                  failures += 1

                  print(
                      f"Week {number}: "
                      f"Supabase error: {error}",
                      flush=True
                  )

          print(
              "\n" + "=" * 55,
              flush=True
          )

          print(
              f"IMPORT COMPLETE: "
              f"{total_saved} score upserts, "
              f"{failures} failures",
              flush=True
          )

          if failures:
              raise SystemExit(1)

          PY
