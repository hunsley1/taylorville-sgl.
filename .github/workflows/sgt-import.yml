
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  import-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Test SGT course par access
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from urllib.parse import urljoin

          tournament = "83767"
          url = (
              "https://simulatorgolftour.com/"
              f"tournament/{tournament}"
          )

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html",
                  },
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", "replace"
                  )

              print(
                  "Tournament page accessible",
                  flush=True
              )

              matches = re.findall(
                  r'[^"<> ]*scorecard[^"<> ]*\.(?:jpg|jpeg|png)[^"<> ]*',
                  html,
                  re.IGNORECASE,
              )

              if not matches:
                  print(
                      "No scorecard image URL found",
                      flush=True
                  )
              else:
                  image_url = urljoin(
                      url, unescape(matches[0])
                  )

                  print(
                      "Scorecard URL:", image_url,
                      flush=True
                  )

                  try:
                      image_req = urllib.request.Request(
                          image_url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Referer": url,
                          },
                      )

                      with urllib.request.urlopen(
                          image_req, timeout=30
                      ) as response:
                          data = response.read()

                      print(
                          "Scorecard downloaded:",
                          len(data), "bytes",
                          flush=True
                      )

                  except Exception as error:
                      print(
                          "Scorecard access failed:",
                          error,
                          flush=True
                      )

          except Exception as error:
              print(
                  "Tournament access failed:",
                  error,
                  flush=True
              )
          PY

      - name: Import completed SGT scores
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import urllib.request
          import urllib.error
          from html import unescape
          from html.parser import HTMLParser

          TOURNAMENTS = {
              4: ["83767"],
          }

          SGT_ALIASES = {
              "mikefnhoncho47": "MIKEFNHONCH047",
          }

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ.get("SUPABASE_KEY", "")

          if not KEY:
              raise RuntimeError(
                  "Missing SUPABASE_SERVICE_ROLE_KEY"
              )

          def request_json(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Accept": "application/json",
              }

              body = None
              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  headers["Prefer"] = (
                      "resolution=merge-duplicates,"
                      "return=representation"
                  )

              req = urllib.request.Request(
                  BASE + "/rest/v1/" + path,
                  data=body,
                  headers=headers,
                  method=method,
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  content = response.read()
                  return json.loads(content) if content else []

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th"):
                      if self.row is not None:
                          self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          self.row.append(
                              unescape(
                                  " ".join(
                                      "".join(self.cell).split()
                                  )
                              )
                          )
                          self.cell = None
                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          def get_scores(tournament, kind):
              url = (
                  "https://simulatorgolftour.com/"
                  f"embed/tournament/{tournament}/"
                  f"standings/{kind}?theme=dark"
              )

              for attempt in range(1, 4):
                  try:
                      print(
                          f"SGT {kind} request "
                          f"attempt {attempt}/3: {url}",
                          flush=True
                      )

                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "text/html",
                          },
                      )

                      with urllib.request.urlopen(
                          req, timeout=30
                      ) as response:
                          html = response.read().decode(
                              "utf-8",
                              errors="replace"
                          )

                      parser = Reader()
                      parser.feed(html)

                      print(
                          f"SGT {kind}: "
                          f"{len(parser.rows)} table rows",
                          flush=True
                      )

                      return parser.rows[1:]

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      ConnectionError,
                  ) as error:
                      print(
                          f"SGT {kind} attempt "
                          f"{attempt}/3 failed: "
                          f"{type(error).__name__}: {error}",
                          flush=True
                      )

                      if attempt < 3:
                          time.sleep(5 * attempt)

              print(
                  f"ERROR: SGT {kind} unavailable "
                  f"after 3 attempts.",
                  flush=True
              )
              return None

          def relative_score(value):
              match = re.search(
                  r"(?<!\d)([+-]\d+|E)(?!\d)",
                  value.upper(),
              )
              if not match:
                  return None

              result = match.group(1)
              return 0 if result == "E" else int(result)

          def finished(row):
              return (
                  len(row) >= 4
                  and bool(re.search(r"\bF\b", row[2]))
              )

          players = request_json(
              "sgl_players?select=username"
          )

          roster = {
              p["username"].strip().casefold():
              p["username"]
              for p in players
          }

          print(
              f"Loaded {len(roster)} league players",
              flush=True
          )

          def match_player(raw):
              name = " ".join(raw.split()).casefold()

              candidates = [name]

              handicap = re.fullmatch(
                  r"(.+?)\s+[-+]?\d+",
                  name
              )

              if handicap:
                  candidates.append(handicap.group(1))

              for candidate in candidates:
                  if candidate in roster:
                      return roster[candidate]

                  alias = SGT_ALIASES.get(candidate)
                  if alias:
                      actual = roster.get(
                          alias.strip().casefold()
                      )
                      if actual:
                          return actual

                      print(
                          "WARNING: Alias target "
                          "missing from roster:",
                          alias
                      )

              return None

          def collect(rows, kind):
              scores = {}

              for row in rows:
                  if len(row) < 4 or not finished(row):
                      continue

                  player = match_player(row[1])
                  score = relative_score(row[3])

                  if player is None:
                      print(
                          f"Unmatched {kind} player:",
                          repr(row[1])
                      )
                      continue

                  if score is None:
                      print(
                          f"Unreadable {kind} score:",
                          player,
                          repr(row[3])
                      )
                      continue

                  scores[player] = score

              return scores

          total = 0
          failed_requests = 0

          for week, tournament_ids in TOURNAMENTS.items():
              for tournament in tournament_ids:
                  print(
                      f"Checking Week {week}, "
                      f"tournament {tournament}",
                      flush=True
                  )

                  gross_rows = get_scores(
                      tournament, "gross"
                  )
                  net_rows = get_scores(
                      tournament, "net"
                  )

                  if gross_rows is None or net_rows is None:
                      failed_requests += 1
                      print(
                          "Skipping tournament import "
                          "because SGT data is unavailable. "
                          "Existing scores remain unchanged.",
                          flush=True
                      )
                      continue

                  gross = collect(gross_rows, "gross")
                  net = collect(net_rows, "net")

                  matched = set(gross) & set(net)

                  for player in sorted(matched):
                      record = {
                          "week_number": week,
                          "username": player,
                          "gross_relative": gross[player],
                          "net_relative": net[player],
                          "status": "played",
                      }

                      request_json(
                          "sgl_scores?"
                          "on_conflict=username,week_number",
                          method="POST",
                          data=[record],
                      )

                      total += 1

                      print(
                          f"Saved Week {week}: "
                          f"{player}, "
                          f"gross {gross[player]:+d}, "
                          f"net {net[player]:+d}",
                          flush=True
                      )

                  print(
                      f"Matched completed players: "
                      f"{len(matched)}",
                      flush=True
                  )

          print(
              f"Import complete: {total} scores; "
              f"{failed_requests} tournament "
              f"requests failed.",
              flush=True
          )

          if failed_requests:
              raise SystemExit(
                  "SGT connection failed. "
                  "No existing scores were deleted."
              )
          PY
