
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  check-sgt:
    runs-on: ubuntu-latest

    steps:
      - name: Check both tournaments
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape
          from html.parser import HTMLParser

          # First ID is confirmed. Add the
          # second Week 4 ID when verified.
          TOURNAMENT_IDS = ["83767"]

          class Reader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  elif tag in ("td", "th"):
                      if self.row is not None:
                          self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          self.row.append(
                              unescape(
                                  " ".join(
                                      "".join(self.cell).split()
                                  )
                              )
                          )
                          self.cell = None
                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          def get_scores(tournament, score_type):
              url = (
                  "https://simulatorgolftour.com/"
                  f"embed/tournament/{tournament}/"
                  f"standings/{score_type}?theme=dark"
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )

              parser = Reader()
              parser.feed(html)
              return parser.rows[1:]

          for tournament in TOURNAMENT_IDS:
              print(f"\nTOURNAMENT {tournament}")

              try:
                  gross = get_scores(
                      tournament, "gross"
                  )
                  net = get_scores(
                      tournament, "net"
                  )

                  print("Gross players:", len(gross))
                  print("Net players:", len(net))

                  print("\nGROSS:")
                  for row in gross:
                      print(" | ".join(row))

                  print("\nNET:")
                  for row in net:
                      print(" | ".join(row))

                  print("\nFINISHED GROSS ROUNDS:")
                  for row in gross:
                      if len(row) >= 4:
                          if re.search(
                              r"\bF\b", row[2]
                          ):
                              print(" | ".join(row))

              except Exception as error:
                  print(
                      "Tournament check failed:",
                      error
                  )
                  raise
          PY
