
name: SGT Automatic Score Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  import-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Install HTML parser
        run: |
          python3 -m pip install --quiet beautifulsoup4

      - name: Import completed SGT scores
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          from bs4 import BeautifulSoup

          SUPABASE = os.environ[
              "SUPABASE_URL"
          ].rstrip("/")

          KEY = os.environ.get(
              "SUPABASE_KEY", ""
          )

          SGT = "https://simulatorgolftour.com"

          if not KEY:
              raise RuntimeError(
                  "Missing SUPABASE_SERVICE_ROLE_KEY secret"
              )

          # Known differences between SGT and
          # Supabase player usernames.
          ALIASES = {
              "mikefnhoncho47": "MIKEFNHONCH047"
          }

          def supabase(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode(
                      "utf-8"
                  )
                  headers["Content-Type"] = (
                      "application/json"
                  )
                  headers["Prefer"] = (
                      "resolution=merge-duplicates,"
                      "return=representation"
                  )

              request = urllib.request.Request(
                  SUPABASE + "/rest/v1/" + path,
                  data=body,
                  headers=headers,
                  method=method
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  raw = response.read()
                  return (
                      json.loads(raw)
                      if raw else []
                  )

          def fetch_sgt(path):
              url = SGT + path

              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "text/html,*/*",
                              "Referer": SGT + "/"
                          }
                      )

                      with urllib.request.urlopen(
                          request, timeout=25
                      ) as response:
                          if response.status != 200:
                              raise RuntimeError(
                                  "HTTP " +
                                  str(response.status)
                              )

                          return response.read().decode(
                              "utf-8", "replace"
                          )

                  except Exception as error:
                      print(
                          "SGT request failed "
                          f"{attempt}/3: {url}: "
                          f"{error}",
                          flush=True
                      )

                      if attempt < 3:
                          time.sleep(attempt * 3)

              return None

          def normalize(value):
              return re.sub(
                  r"\s+", " ", str(value)
              ).strip().casefold()

          players = supabase(
              "sgl_players?select=username"
          )

          roster = {
              normalize(player["username"]):
              player["username"]
              for player in players
          }

          weeks = supabase(
              "sgl_weeks?select="
              "week_number,"
              "tournament_1_id,"
              "tournament_2_id,"
              "course_par"
              "&order=week_number.asc"
          )

          print(
              f"Loaded {len(roster)} players "
              f"and {len(weeks)} weeks",
              flush=True
          )

          if not roster or not weeks:
              raise RuntimeError(
                  "League roster or weeks are empty"
              )

          def match_player(name):
              cleaned = normalize(name)

              candidates = [cleaned]

              # Remove trailing handicap if present.
              without_handicap = re.sub(
                  r"\s+[-+]?\d+(?:\.\d+)?$",
                  "",
                  cleaned
              )

              if without_handicap != cleaned:
                  candidates.append(
                      without_handicap
                  )

              for candidate in candidates:
                  if candidate in roster:
                      return roster[candidate]

                  alias = ALIASES.get(candidate)

                  if alias:
                      actual = roster.get(
                          normalize(alias)
                      )

                      if actual:
                          return actual

              return None

          def find_player(row):
              # SGT sometimes provides the player
              # name as an HTML data attribute.
              for element in [row] + row.find_all(
                  attrs={"data-player-name": True}
              ):
                  name = element.get(
                      "data-player-name"
                  )

                  if name:
                      player = match_player(name)

                      if player:
                          return player

              # Otherwise inspect player links.
              for link in row.find_all("a"):
                  name = link.get_text(
                      " ", strip=True
                  )

                  player = match_player(name)

                  if player:
                      return player

              # Finally inspect individual cells.
              for cell in row.find_all(
                  ["td", "th"], recursive=False
              ):
                  name = cell.get_text(
                      " ", strip=True
                  )

                  player = match_player(name)

                  if player:
                      return player

                  # Remove common scorecard labels.
                  name = re.sub(
                      r"\b(SCORECARD|CARD)\b",
                      "",
                      name,
                      flags=re.I
                  ).strip()

                  player = match_player(name)

                  if player:
                      return player

              return None

          def parse_relative(value):
              value = value.strip().upper()

              if value == "E":
                  return 0

              if re.fullmatch(
                  r"[+-]\d+", value
              ):
                  return int(value)

              return None

          def parse_leaderboard(html, kind, tid):
              soup = BeautifulSoup(
                  html, "html.parser"
              )

              scores = {}
              unmatched = set()
              unfinished = 0

              rows = soup.find_all("tr")

              print(
                  f"{tid} {kind}: "
                  f"{len(rows)} HTML rows",
                  flush=True
              )

              for row in rows:
                  cells = row.find_all(
                      ["td", "th"],
                      recursive=False
                  )

                  if not cells:
                      continue

                  values = [
                      cell.get_text(
                          " ", strip=True
                      )
                      for cell in cells
                  ]

                  # SGT marks completed rounds
                  # with F in the leaderboard.
                  finished = any(
                      re.fullmatch(
                          r"F", value.strip(),
                          flags=re.I
                      )
                      for value in values
                  )

                  if not finished:
                      unfinished += 1
                      continue

                  player = find_player(row)

                  if player is None:
                      text = row.get_text(
                          " ", strip=True
                      )

                      if text:
                          unmatched.add(
                              text[:120]
                          )

                      continue

                  # The rightmost relative score
                  # is the tournament total.
                  relative_values = []

                  for value in values:
                      score = parse_relative(value)

                      if score is not None:
                          relative_values.append(
                              score
                          )

                  if not relative_values:
                      print(
                          f"Missing {kind} score "
                          f"for {player}: {values}",
                          flush=True
                      )
                      continue

                  score = relative_values[-1]

                  if player in scores:
                      raise RuntimeError(
                          f"Duplicate {kind} "
                          f"player {player} "
                          f"in tournament {tid}"
                      )

                  scores[player] = score

                  print(
                      f"{kind.upper()}: "
                      f"{player} {score:+d}",
                      flush=True
                  )

              for value in sorted(unmatched):
                  print(
                      f"Unmatched finished "
                      f"{kind} row: {value}",
                      flush=True
                  )

              print(
                  f"{tid} {kind}: "
                  f"{len(scores)} matched "
                  f"finished players; "
                  f"{unfinished} other rows",
                  flush=True
              )

              return scores

          def fetch_scores(tid, kind):
              suffix = (
                  "/net" if kind == "net" else ""
              )

              path = (
                  f"/sgt-api/leaderboard/"
                  f"{tid}{suffix}"
              )

              html = fetch_sgt(path)

              if html is None:
                  raise RuntimeError(
                      f"Cannot retrieve {kind} "
                      f"leaderboard for {tid}"
                  )

              if not html.strip():
                  raise RuntimeError(
                      f"Empty {kind} "
                      f"leaderboard for {tid}"
                  )

              return parse_leaderboard(
                  html, kind, tid
              )

          def inspect_prizes(tid):
              # Read prize endpoints without
              # changing the Supabase database.
              for kind, suffix in [
                  ("CTP", "ctp"),
                  ("LONG DRIVE", "ld")
              ]:
                  path = (
                      f"/sgt-api/leaderboard/"
                      f"{tid}/{suffix}"
                  )

                  html = fetch_sgt(path)

                  if html is None:
                      print(
                          f"{tid} {kind}: "
                          "unavailable",
                          flush=True
                      )
                      continue

                  soup = BeautifulSoup(
                      html, "html.parser"
                  )

                  text = soup.get_text(
                      " ", strip=True
                  )

                  print(
                      f"{tid} {kind}: "
                      f"{text[:300]}",
                      flush=True
                  )

          total_saved = 0
          failures = 0

          for week in weeks:
              number = week["week_number"]

              tournaments = []

              for field in [
                  "tournament_1_id",
                  "tournament_2_id"
              ]:
                  value = week.get(field)

                  if value is not None:
                      tid = str(value).strip()

                      if (
                          tid
                          and tid not in tournaments
                      ):
                          tournaments.append(tid)

              if not tournaments:
                  print(
                      f"Week {number}: "
                      "no tournaments configured",
                      flush=True
                  )
                  continue

              print(
                  "\n" + "=" * 55,
                  flush=True
              )
              print(
                  f"WEEK {number}: "
                  f"{tournaments}",
                  flush=True
              )

              # Collect the entire week's scores
              # before making database changes.
              week_records = {}
              week_failed = False

              for tid in tournaments:
                  try:
                      gross = fetch_scores(
                          tid, "gross"
                      )

                      net = fetch_scores(
                          tid, "net"
                      )

                      completed = (
                          set(gross) & set(net)
                      )

                      for player in sorted(completed):
                          if player in week_records:
                              raise RuntimeError(
                                  "Player appears in "
                                  "multiple tournaments "
                                  f"for Week {number}: "
                                  f"{player}"
                              )

                          week_records[player] = {
                              "username": player,
                              "week_number": number,
                              "gross_relative":
                                  gross[player],
                              "net_relative":
                                  net[player],
                              "status": "played"
                          }

                      only_gross = (
                          set(gross) - set(net)
                      )

                      only_net = (
                          set(net) - set(gross)
                      )

                      if only_gross or only_net:
                          print(
                              f"{tid}: incomplete "
                              "gross/net pairing; "
                              f"gross-only={sorted(only_gross)}, "
                              f"net-only={sorted(only_net)}",
                              flush=True
                          )

                      print(
                          f"{tid}: "
                          f"{len(completed)} "
                          "completed score pairs",
                          flush=True
                      )

                      inspect_prizes(tid)

                  except Exception as error:
                      week_failed = True
                      failures += 1

                      print(
                          f"Week {number}, "
                          f"tournament {tid}: "
                          f"ERROR: {error}",
                          flush=True
                      )

              if week_failed:
                  print(
                      f"Week {number}: "
                      "skipping database writes "
                      "because at least one "
                      "tournament failed",
                      flush=True
                  )
                  continue

              if not week_records:
                  print(
                      f"Week {number}: "
                      "no completed matched "
                      "scores to import",
                      flush=True
                  )
                  continue

              records = list(
                  week_records.values()
              )

              try:
                  saved = supabase(
                      "sgl_scores?on_conflict="
                      "username,week_number",
                      method="POST",
                      data=records
                  )

                  if len(saved) != len(records):
                      raise RuntimeError(
                          "Supabase returned "
                          "an unexpected number "
                          "of saved records"
                      )

                  total_saved += len(saved)

                  print(
                      f"Week {number}: "
                      f"saved {len(saved)} "
                      "completed scores",
                      flush=True
                  )

              except Exception as error:
                  failures += 1

                  print(
                      f"Week {number}: "
                      f"database error: {error}",
                      flush=True
                  )

          print(
              "\n" + "=" * 55,
              flush=True
          )

          print(
              "IMPORT COMPLETE",
              flush=True
          )

          print(
              f"Score records saved: "
              f"{total_saved}",
              flush=True
          )

          print(
              f"Failures: {failures}",
              flush=True
          )

          if failures:
              raise SystemExit(
                  "Import completed with errors. "
                  "Review logs."
              )

          PY
