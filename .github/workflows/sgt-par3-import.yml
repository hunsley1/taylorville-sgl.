name: SGT Automatic Par 3 Import

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: sgt-par3-import
  cancel-in-progress: false

jobs:
  import-par3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install HTML parser
        run: python3 -m pip install --quiet beautifulsoup4

      - name: Import closest-to-pin results
        env:
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import urllib.request
          import urllib.parse
          import urllib.error

          from decimal import Decimal, InvalidOperation
          from bs4 import BeautifulSoup

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          SGT = "https://simulatorgolftour.com"

          if not KEY:
              raise RuntimeError(
                  "Missing Supabase service role secret"
              )

          def request_url(
              url,
              method="GET",
              data=None,
              headers=None
          ):
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=data,
                          headers=headers or {},
                          method=method
                      )

                      with urllib.request.urlopen(
                          request, timeout=40
                      ) as response:
                          return response.read()

                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode(
                          "utf-8", "replace"
                      )

                      print(
                          f"HTTP {exc.code}: {detail[:500]}",
                          flush=True
                      )

                      if exc.code not in (
                          408, 429, 500, 502, 503, 504
                      ):
                          raise

                      if attempt == 2:
                          raise

                  except Exception as exc:
                      print(
                          f"Request attempt "
                          f"{attempt + 1}: {exc}",
                          flush=True
                      )

                      if attempt == 2:
                          raise

                  time.sleep(3 * (attempt + 1))

          def db(
              table,
              method="GET",
              payload=None,
              params=None
          ):
              url = BASE + "/rest/v1/" + table

              if params:
                  url += "?" + urllib.parse.urlencode(
                      params, safe="(),.*"
                  )

              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json"
              }

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode()

                  headers["Content-Type"] = (
                      "application/json"
                  )

                  headers["Prefer"] = (
                      "resolution=merge-duplicates,"
                      "return=representation"
                  )

              body = request_url(
                  url,
                  method=method,
                  data=data,
                  headers=headers
              )

              return json.loads(body) if body else []

          def read_rows(table, params, order):
              rows = []
              offset = 0

              while True:
                  query = dict(params)

                  query["order"] = order
                  query["limit"] = 500
                  query["offset"] = offset

                  page = db(
                      table,
                      params=query
                  )

                  if not page:
                      break

                  rows.extend(page)
                  offset += len(page)

              return rows

          def fetch_ctp(tournament_id):
              url = (
                  f"{SGT}/sgt-api/leaderboard/"
                  f"{tournament_id}/ctp"
              )

              body = request_url(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html,*/*",
                      "Referer": SGT + "/"
                  }
              )

              return body.decode(
                  "utf-8", "replace"
              )

          def normalize(value):
              return re.sub(
                  r"\s+", "", str(value or "")
              ).casefold()

          def parse_shots(html):
              soup = BeautifulSoup(
                  html, "html.parser"
              )

              shots = {}

              for section in soup.select(
                  ".hole-section"
              ):
                  title = section.select_one(
                      ".stat-leader-title"
                  )

                  if title is None:
                      continue

                  title_text = title.get_text(
                      " ", strip=True
                  )

                  match = re.search(
                      r"\bHOLE\s+(\d+)\b",
                      title_text,
                      re.IGNORECASE
                  )

                  if not match:
                      continue

                  hole = int(match.group(1))

                  if not 1 <= hole <= 18:
                      continue

                  for row in section.select(
                      ".hole-leader-row[data-player-name]"
                  ):
                      username = row.get(
                          "data-player-name", ""
                      ).strip()

                      value = row.select_one(
                          ".hole-leader-value"
                      )

                      if not username or value is None:
                          continue

                      raw = value.get_text(
                          " ", strip=True
                      ).replace(",", "")

                      number = re.search(
                          r"-?\d+(?:\.\d+)?",
                          raw
                      )

                      if not number:
                          continue

                      try:
                          distance = Decimal(
                              number.group()
                          )

                      except InvalidOperation:
                          continue

                      if (
                          not distance.is_finite()
                          or distance < 0
                      ):
                          continue

                      key = (
                          normalize(username),
                          hole
                      )

                      if (
                          key not in shots
                          or distance < shots[key][1]
                      ):
                          shots[key] = (
                              username,
                              distance
                          )

              return [
                  (username, hole, distance)
                  for (_, hole), (
                      username, distance
                  ) in shots.items()
              ]

          print(
              "=== AUTOMATIC PAR 3 IMPORT ===",
              flush=True
          )

          sessions = db(
              "sgl_sessions",
              params={
                  "select":
                  "id,session_name,total_weeks",
                  "status": "eq.active"
              }
          )

          if not sessions:
              print(
                  "No active session. Nothing to import.",
                  flush=True
              )
              raise SystemExit(0)

          if len(sessions) != 1:
              raise RuntimeError(
                  "Expected exactly one active session"
              )

          session = sessions[0]
          session_id = int(session["id"])

          print(
              f"Active session: "
              f"{session['session_name']}",
              flush=True
          )

          print(
              f"Session ID: {session_id}",
              flush=True
          )

          print(
              f"Total weeks: {session['total_weeks']}",
              flush=True
          )

          players = read_rows(
              "sgl_players",
              {
                  "select": "username",
                  "session_id": f"eq.{session_id}"
              },
              "username.asc"
          )

          weeks = read_rows(
              "sgl_weeks",
              {
                  "select": (
                      "week_number,"
                      "tournament_1_id,"
                      "tournament_2_id,"
                      "finalized"
                  ),
                  "session_id": f"eq.{session_id}"
              },
              "week_number.asc"
          )

          existing = read_rows(
              "sgl_par3_shots",
              {
                  "select": (
                      "id,tournament_id,"
                      "username,hole_number,"
                      "distance_ft"
                  ),
                  "session_id": f"eq.{session_id}"
              },
              "id.asc"
          )

          if not players or not weeks:
              raise RuntimeError(
                  "Missing players or weeks"
              )

          player_lookup = {}

          for player in players:
              username = player["username"]
              key = normalize(username)

              if key in player_lookup:
                  raise RuntimeError(
                      f"Duplicate roster name: "
                      f"{username}"
                  )

              player_lookup[key] = username

          # Preserve known SGT spelling correction.

          canonical = player_lookup.get(
              normalize("MIKEFNHONCH047")
          )

          if canonical:
              player_lookup.setdefault(
                  normalize("MikeFNHoncho47"),
                  canonical
              )

          best_existing = {
              (
                  int(s["tournament_id"]),
                  normalize(s["username"]),
                  int(s["hole_number"])
              ): Decimal(str(s["distance_ft"]))
              for s in existing
          }

          print(
              f"Loaded {len(players)} players, "
              f"{len(weeks)} weeks and "
              f"{len(existing)} existing shots",
              flush=True
          )

          def verify_week_open(
              week_number,
              tournament_id
          ):
              active = db(
                  "sgl_sessions",
                  params={
                      "select": "id",
                      "id": f"eq.{session_id}",
                      "status": "eq.active"
                  }
              )

              if len(active) != 1:
                  return False

              current = db(
                  "sgl_weeks",
                  params={
                      "select": (
                          "finalized,"
                          "tournament_1_id,"
                          "tournament_2_id"
                      ),
                      "session_id": f"eq.{session_id}",
                      "week_number": f"eq.{week_number}"
                  }
              )

              if len(current) != 1:
                  return False

              row = current[0]

              if row["finalized"]:
                  return False

              ids = [
                  int(row[field])
                  for field in (
                      "tournament_1_id",
                      "tournament_2_id"
                  )
                  if row.get(field) is not None
              ]

              return (
                  len(set(ids)) == 2
                  and tournament_id in ids
              )

          total = 0
          errors = 0

          for week in weeks:
              week_number = int(
                  week["week_number"]
              )

              if week["finalized"]:
                  print(
                      f"Week {week_number}: "
                      "Finalized. Protected.",
                      flush=True
                  )
                  continue

              ids = []

              for field in (
                  "tournament_1_id",
                  "tournament_2_id"
              ):
                  value = week.get(field)

                  if value:
                      ids.append(int(value))

              ids = list(dict.fromkeys(ids))

              if len(ids) != 2:
                  print(
                      f"Week {week_number}: "
                      "Waiting for both tournaments",
                      flush=True
                  )
                  continue

              for tid in ids:
                  try:
                      html = fetch_ctp(tid)
                      shots = parse_shots(html)

                      print(
                          f"Week {week_number}, "
                          f"tournament {tid}: "
                          f"{len(shots)} shots found",
                          flush=True
                      )

                      candidates = {}
                      unknown = set()

                      for name, hole, distance in shots:
                          canonical = player_lookup.get(
                              normalize(name)
                          )

                          if canonical is None:
                              unknown.add(name)
                              continue

                          key = (
                              tid,
                              normalize(canonical),
                              hole
                          )

                          previous = best_existing.get(
                              key
                          )

                          if (
                              previous is not None
                              and distance >= previous
                          ):
                              continue

                          candidate = candidates.get(
                              key
                          )

                          if (
                              candidate is not None
                              and distance >= Decimal(
                                  candidate["distance_ft"]
                              )
                          ):
                              continue

                          candidates[key] = {
                              "session_id": session_id,
                              "week_number": week_number,
                              "tournament_id": tid,
                              "username": canonical,
                              "hole_number": hole,
                              "distance_ft": str(distance)
                          }

                      if unknown:
                          print(
                              "Skipped unknown players: "
                              + ", ".join(sorted(unknown)),
                              flush=True
                          )

                      updates = list(
                          candidates.values()
                      )

                      if updates:
                          if not verify_week_open(
                              week_number, tid
                          ):
                              raise RuntimeError(
                                  "Session or week changed "
                                  "during import"
                              )

                          saved = db(
                              "sgl_par3_shots",
                              method="POST",
                              payload=updates,
                              params={
                                  "on_conflict": (
                                      "session_id,"
                                      "tournament_id,"
                                      "username,"
                                      "hole_number"
                                  )
                              }
                          )

                          if len(saved) != len(updates):
                              raise RuntimeError(
                                  "Supabase did not confirm "
                                  "every shot"
                              )

                          for key, record in (
                              candidates.items()
                          ):
                              best_existing[key] = Decimal(
                                  record["distance_ft"]
                              )

                          total += len(saved)

                      print(
                          f"Saved {len(updates)} "
                          "new or improved shots",
                          flush=True
                      )

                  except Exception as exc:
                      errors += 1

                      print(
                          f"ERROR week {week_number}, "
                          f"tournament {tid}: {exc}",
                          flush=True
                      )

          print(
              f"\nSESSION: {session['session_name']}",
              flush=True
          )

          print(
              f"PAR 3 IMPORT COMPLETE: "
              f"{total} upserts, "
              f"{errors} tournament errors",
              flush=True
          )

          if errors:
              raise SystemExit(
                  "Some tournament imports failed"
              )

          PY
