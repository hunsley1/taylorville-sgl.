
name: Test SGT Leaderboard HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Install parser
        run: |
          python3 -m pip install --quiet beautifulsoup4

      - name: Inspect completed player rows
        run: |
          python3 - <<'PY'
          import urllib.request
          from bs4 import BeautifulSoup

          BASE = (
              "https://simulatorgolftour.com"
              "/sgt-api/leaderboard/83767"
          )

          for label, url in [
              ("GROSS", BASE),
              ("NET", BASE + "/net")
          ]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html,*/*",
                      "Referer": (
                          "https://simulatorgolftour.com/"
                      )
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  html = response.read().decode(
                      "utf-8", "replace"
                  )

              soup = BeautifulSoup(
                  html, "html.parser"
              )

              print("\n" + "=" * 60)
              print(label + " LEADERBOARD")
              print("=" * 60)

              rows = soup.find_all("tr")

              for index, row in enumerate(
                  rows[:5]
              ):
                  print(
                      f"\nROW {index}:",
                      flush=True
                  )
                  print(
                      row.prettify()[:6000],
                      flush=True
                  )

          PY
