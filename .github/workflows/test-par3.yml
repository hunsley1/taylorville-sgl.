
name: Test SGT Par 3 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-par3:
    runs-on: ubuntu-latest

    steps:
      - name: Find closest-to-pin API URL
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          url = (
              "https://sgt-static.b-cdn.net"
              "/public/tournament/page.js?v=2.0.21"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Referer":
                      "https://simulatorgolftour.com/"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              script = response.read().decode(
                  "utf-8", "replace"
              )

          print("JavaScript downloaded successfully")
          print("Size:", len(script))

          for name in [
              "Build_Request_Url",
              "Fetch_Data",
              "APIBASE"
          ]:
              print("\n" + "=" * 50)
              print("SEARCH:", name)

              matches = list(re.finditer(
                  re.escape(name),
                  script,
                  flags=re.IGNORECASE
              ))

              for match in matches[:8]:
                  start = max(0, match.start() - 150)
                  end = min(
                      len(script),
                      match.end() + 1800
                  )

                  print(script[start:end])
                  print("\n---")

          print("\nTEST COMPLETE")
          PY
