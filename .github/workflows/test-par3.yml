
name: Test SGT Par 3 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-par3:
    runs-on: ubuntu-latest

    steps:
      - name: Find SGT API base and test CTP
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html import unescape

          BASE = "https://simulatorgolftour.com"
          TID = "83767"

          def fetch(url):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "text/html,*/*",
                          "Referer": BASE + "/"
                      }
                  )
                  with urllib.request.urlopen(
                      req, timeout=15
                  ) as response:
                      body = response.read().decode(
                          "utf-8", "replace"
                      )
                      print(
                          "HTTP:", response.status,
                          "SIZE:", len(body)
                      )
                      return body
              except Exception as e:
                  print("ERROR:", str(e))
                  return ""

          print("STEP 1: Find APIBASE")
          html = fetch(BASE + "/tournament/" + TID)

          matches = re.findall(
              r'.{0,150}APIBASE.{0,250}',
              html,
              flags=re.I
          )

          for match in matches[:10]:
              print(unescape(match))

          base_match = re.search(
              r'APIBASE\s*=\s*["\']([^"\']+)["\']',
              html
          )

          if base_match:
              api = base_match.group(1)
          else:
              print(
                  "APIBASE not directly defined. "
                  "Checking common.js."
              )
              common = fetch(
                  "https://sgt-static.b-cdn.net/"
                  "public/assets/pageCommon/"
                  "common.js?v=2.0.21"
              )
              for match in re.findall(
                  r'.{0,100}APIBASE.{0,200}',
                  common
              )[:10]:
                  print(match)
              api = ""

          if not api:
              print("API base still needs identification.")
              raise SystemExit(0)

          from urllib.parse import urljoin

          api = urljoin(BASE, api)
          if not api.endswith("/"):
              api += "/"

          print("API BASE:", api)

          print("\nSTEP 2: Test endpoints")

          endpoints = {
              "CTP": f"leaderboard/{TID}/ctp",
              "GROSS": f"leaderboard/{TID}",
              "NET": f"leaderboard/{TID}/net",
              "LONG DRIVE": f"leaderboard/{TID}/ld"
          }

          for name, path in endpoints.items():
              url = api + path
              print("\n" + "=" * 45)
              print(name, url)
              result = fetch(url)
              print("PREVIEW:")
              print(result[:2500])

              if result:
                  for keyword in [
                      "MASON", "shot-plot",
                      "data-shots", "leader-row"
                  ]:
                      print(
                          keyword,
                          "FOUND" if keyword.lower()
                          in result.lower() else "not found"
                      )

          print("\nTEST COMPLETE")
          PY
