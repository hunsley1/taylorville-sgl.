
name: SGT Automatic Tournament Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: sgt-tournament-discovery
  cancel-in-progress: false

jobs:
  discover-tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Discover session tournaments
        env:
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import urllib.request
          import urllib.parse
          from html.parser import HTMLParser

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]

          TOURS = {
              "Hunsley1": 3927,
              "Hunsley2": 3085
          }

          SGT = "https://simulatorgolftour.com"

          def request(url, method="GET", data=None, headers=None):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          headers=headers or {},
                          method=method
                      )
                      with urllib.request.urlopen(
                          req, timeout=40
                      ) as response:
                          return response.read().decode("utf-8")
                  except Exception as exc:
                      print(
                          f"Request attempt {attempt + 1}: {exc}"
                      )
                      if attempt == 2:
                          raise
                      time.sleep(3 * (attempt + 1))

          def supabase(table, params=None, method="GET", payload=None):
              url = f"{BASE}/rest/v1/{table}"

              if params:
                  url += "?" + urllib.parse.urlencode(params)

              headers = {
                  "apikey": KEY,
                  "Authorization": f"Bearer {KEY}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation"
              }

              data = (
                  json.dumps(payload).encode("utf-8")
                  if payload is not None
                  else None
              )

              result = request(
                  url,
                  method=method,
                  data=data,
                  headers=headers
              )

              return json.loads(result) if result else []

          class EventParser(HTMLParser):

              def __init__(self):
                  super().__init__()
                  self.events = []
                  self.current_id = None
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag != "a":
                      return

                  classes = attrs.get("class", "").split()

                  if "event-card-name" not in classes:
                      return

                  match = re.search(
                      r"/tournament/(\d+)",
                      attrs.get("href", "")
                  )

                  if match:
                      self.current_id = int(match.group(1))
                      self.parts = []

              def handle_data(self, data):
                  if self.current_id is not None:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.current_id is not None:
                      name = " ".join(
                          "".join(self.parts).split()
                      )

                      self.events.append(
                          (self.current_id, name)
                      )

                      self.current_id = None
                      self.parts = []

          sessions = supabase(
              "sgl_sessions",
              {
                  "select": "*",
                  "status": "eq.active"
              }
          )

          if len(sessions) != 1:
              raise RuntimeError(
                  "Expected exactly one active session."
              )

          session = sessions[0]

          session_id = int(session["id"])
          year = int(session["season_year"])
          session_number = int(session["session_number"])
          total_weeks = int(session["total_weeks"])

          print(f"Active session: {session['session_name']}")
          print(f"Session ID: {session_id}")
          print(f"Total weeks: {total_weeks}")

          weeks = supabase(
              "sgl_weeks",
              {
                  "select": "*",
                  "session_id": f"eq.{session_id}",
                  "order": "week_number.asc"
              }
          )

          if not weeks:
              raise RuntimeError(
                  "No weeks exist for the active session."
              )

          week_map = {
              int(w["week_number"]): w
              for w in weeks
          }

          legacy_session = (
              year == 2026 and session_number == 1
          )

          # Accept optional course names after the week number.
          # Examples:
          # TGSL Week5 Red Tail Run
          # TGSL 2026 S2 Week1 Red Tail Run

          session_pattern = re.compile(
              rf"^TGSL[\s_-]+{year}"
              rf"[\s_-]+S{session_number}"
              rf"[\s_-]+Week[\s_-]*(\d+)"
              rf"(?:[\s_-]+.+)?$",
              re.IGNORECASE
          )

          legacy_pattern = re.compile(
              r"^TGSL[\s_-]*Week[\s_-]*(\d+)"
              r"(?:[\s_-]+.+)?$",
              re.IGNORECASE
          )

          def discover(tour_name, tour_id):

              url = f"{SGT}/sgt-api/tour/{tour_id}/events"

              print("")
              print(f"Checking {tour_name} (Tour {tour_id})")

              html = request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html"
                  }
              )

              parser = EventParser()
              parser.feed(html)

              print(
                  f"{tour_name}: "
                  f"{len(parser.events)} tournament entries found."
              )

              if not parser.events:
                  print(
                      f"WARNING: No tournament entries "
                      f"parsed for {tour_name}."
                  )

              found = {}

              for tournament_id, name in parser.events:

                  print(
                      f"{tour_name}: SGT event "
                      f"{tournament_id} - {name}"
                  )

                  match = session_pattern.fullmatch(name)

                  if not match and legacy_session:
                      match = legacy_pattern.fullmatch(name)

                  if not match:
                      print(
                          "  Skipped: Does not match "
                          "active session naming."
                      )
                      continue

                  week = int(match.group(1))

                  if week < 1 or week > total_weeks:
                      print(
                          f"  Skipped: Week {week} "
                          "outside session range."
                      )
                      continue

                  if legacy_session and week < 5:
                      print(
                          f"  Skipped: Historical Week {week}."
                      )
                      continue

                  row = week_map.get(week)

                  if not row:
                      print(
                          f"  Skipped: Week {week} "
                          "not configured."
                      )
                      continue

                  if row["finalized"]:
                      print(
                          f"  Skipped: Week {week} finalized."
                      )
                      continue

                  if (
                      week in found
                      and found[week] != tournament_id
                  ):
                      raise RuntimeError(
                          f"Duplicate tournament for "
                          f"{tour_name}, Week {week}"
                      )

                  found[week] = tournament_id

                  print(
                      f"MATCH: {tour_name}: Week {week} "
                      f"-> Tournament {tournament_id}"
                  )

              print(
                  f"{tour_name}: "
                  f"{len(found)} matching open weeks."
              )

              return found

          discovered = {
              name: discover(name, tour_id)
              for name, tour_id in TOURS.items()
          }

          first = discovered["Hunsley1"]
          second = discovered["Hunsley2"]

          print("")
          print(f"Hunsley1 matches: {first}")
          print(f"Hunsley2 matches: {second}")

          for week in sorted(set(first) - set(second)):
              print(
                  f"Week {week}: Waiting for "
                  "Hunsley2 tournament."
              )

          for week in sorted(set(second) - set(first)):
              print(
                  f"Week {week}: Waiting for "
                  "Hunsley1 tournament."
              )

          # Preserve the existing tournament column order.
          # Read the original Session 1 Week 4 mapping.

          original_sessions = supabase(
              "sgl_sessions",
              {
                  "select": "id",
                  "season_year": "eq.2026",
                  "session_number": "eq.1"
              }
          )

          if len(original_sessions) != 1:
              raise RuntimeError(
                  "Original session mapping not found."
              )

          original_id = original_sessions[0]["id"]

          original_week = supabase(
              "sgl_weeks",
              {
                  "select": "tournament_1_id,tournament_2_id",
                  "session_id": f"eq.{original_id}",
                  "week_number": "eq.4"
              }
          )

          if len(original_week) != 1:
              raise RuntimeError(
                  "Original tournament mapping not found."
              )

          mapping = original_week[0]

          original_pair = (
              mapping["tournament_1_id"],
              mapping["tournament_2_id"]
          )

          if original_pair == (83765, 83767):
              reverse_order = False
          elif original_pair == (83767, 83765):
              reverse_order = True
          else:
              raise RuntimeError(
                  "Unexpected original tournament mapping."
              )

          updated = 0

          for week in sorted(set(first) & set(second)):

              row = week_map.get(week)

              if not row:
                  print(f"Week {week}: Not configured.")
                  continue

              if row["finalized"]:
                  print(f"Week {week}: Finalized. Skipping.")
                  continue

              if legacy_session and week < 5:
                  continue

              tid1 = first[week]
              tid2 = second[week]

              if reverse_order:
                  tid1, tid2 = tid2, tid1

              if tid1 == tid2:
                  raise RuntimeError(
                      f"Week {week}: Duplicate tournament IDs."
                  )

              old1 = row.get("tournament_1_id")
              old2 = row.get("tournament_2_id")

              if old1 not in (None, tid1):
                  print(
                      f"Week {week}: Tournament 1 conflict. "
                      "Existing ID preserved."
                  )
                  continue

              if old2 not in (None, tid2):
                  print(
                      f"Week {week}: Tournament 2 conflict. "
                      "Existing ID preserved."
                  )
                  continue

              if old1 == tid1 and old2 == tid2:
                  print(f"Week {week}: Already configured.")
                  continue

              filters = {
                  "session_id": f"eq.{session_id}",
                  "week_number": f"eq.{week}",
                  "finalized": "eq.false",
                  "tournament_1_id": (
                      "is.null" if old1 is None
                      else f"eq.{old1}"
                  ),
                  "tournament_2_id": (
                      "is.null" if old2 is None
                      else f"eq.{old2}"
                  )
              }

              result = supabase(
                  "sgl_weeks",
                  filters,
                  method="PATCH",
                  payload={
                      "tournament_1_id": tid1,
                      "tournament_2_id": tid2
                  }
              )

              if len(result) != 1:
                  raise RuntimeError(
                      f"Week {week}: Update not confirmed."
                  )

              updated += 1

              print(
                  f"Week {week}: Saved "
                  f"{tid1} and {tid2}"
              )

          print("")
          print(
              f"Discovery complete. "
              f"{updated} weeks updated."
          )
          PY
