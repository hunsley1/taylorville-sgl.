
name: SGT Automatic Tournament Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: sgt-tournament-discovery
  cancel-in-progress: false

jobs:
  discover-tournaments:
    runs-on: ubuntu-latest

    steps:
      - name: Discover and save tournament IDs
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://xgjziyopzeeneccfaszb.supabase.co

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ.get("SUPABASE_KEY", "")
          SGT = "https://simulatorgolftour.com"

          TOURS = {
              "Hunsley1": 3927,
              "Hunsley2": 3085
          }

          if not KEY:
              raise RuntimeError(
                  "Missing Supabase service role secret"
              )

          def db(path, method="GET", data=None):
              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Accept": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = (
                      "application/json"
                  )
                  headers["Prefer"] = (
                      "return=representation"
                  )

              request = urllib.request.Request(
                  BASE + "/rest/v1/" + path,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      content = response.read()
                      return (
                          json.loads(content)
                          if content else []
                      )

              except urllib.error.HTTPError as error:
                  detail = error.read().decode(
                      "utf-8", "replace"
                  )[:600]

                  raise RuntimeError(
                      f"Supabase {method} "
                      f"{path.split('?')[0]} "
                      f"failed: HTTP {error.code}: "
                      f"{detail}"
                  ) from None

          def fetch_events(tour_id):
              url = (
                  f"{SGT}/sgt-api/tour/"
                  f"{tour_id}/events"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html,*/*",
                      "Referer": SGT + "/"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8", "replace"
                  )

          class EventParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.events = []
                  self.current_id = None
                  self.collecting = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag != "a":
                      return

                  classes = attrs.get(
                      "class", ""
                  ).split()

                  if "event-card-name" not in classes:
                      return

                  match = re.fullmatch(
                      r"/tournament/(\d+)",
                      attrs.get("href", "")
                  )

                  if match:
                      self.current_id = int(
                          match.group(1)
                      )
                      self.collecting = True
                      self.parts = []

              def handle_data(self, data):
                  if self.collecting:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "a" and self.collecting:
                      name = "".join(
                          self.parts
                      ).strip()

                      self.events.append(
                          (self.current_id, name)
                      )

                      self.current_id = None
                      self.collecting = False
                      self.parts = []

          def discover(tour_id):
              parser = EventParser()
              parser.feed(fetch_events(tour_id))

              found = {}

              for tournament_id, name in parser.events:
                  match = re.search(
                      r"\bTGSL[\s_-]*Week[\s_-]*(\d+)\b",
                      name,
                      re.I
                  )

                  if not match:
                      continue

                  week = int(match.group(1))

                  if week < 5:
                      continue

                  if week in found:
                      raise RuntimeError(
                          f"Duplicate Week {week} "
                          f"on tour {tour_id}"
                      )

                  found[week] = tournament_id

                  print(
                      f"Tour {tour_id}: "
                      f"Week {week} = "
                      f"{tournament_id} ({name})",
                      flush=True
                  )

              return found

          print(
              "=== AUTOMATIC TOURNAMENT DISCOVERY ===",
              flush=True
          )

          # Verify Supabase access first.
          weeks = db(
              "sgl_weeks?select="
              "week_number,"
              "tournament_1_id,"
              "tournament_2_id"
              "&order=week_number.asc"
          )

          print(
              f"Supabase connected: "
              f"{len(weeks)} weeks loaded",
              flush=True
          )

          by_week = {
              int(row["week_number"]): row
              for row in weeks
          }

          reference = by_week.get(4)

          if not reference:
              raise RuntimeError(
                  "Week 4 reference missing"
              )

          first = str(
              reference.get("tournament_1_id")
          )
          second = str(
              reference.get("tournament_2_id")
          )

          if first == "83765" and second == "83767":
              columns = {
                  "Hunsley1": "tournament_1_id",
                  "Hunsley2": "tournament_2_id"
              }

          elif first == "83767" and second == "83765":
              columns = {
                  "Hunsley1": "tournament_2_id",
                  "Hunsley2": "tournament_1_id"
              }

          else:
              raise RuntimeError(
                  "Week 4 tournament IDs do not "
                  "match the verified tour IDs. "
                  "No changes made."
              )

          events = {}

          for name, tour_id in TOURS.items():
              print(
                  f"Checking {name} ({tour_id})",
                  flush=True
              )
              events[name] = discover(tour_id)

          common_weeks = sorted(
              set(events["Hunsley1"])
              & set(events["Hunsley2"])
          )

          updated = 0

          for week in common_weeks:
              row = by_week.get(week)

              if row is None:
                  print(
                      f"Week {week}: "
                      "not in Supabase, skipped",
                      flush=True
                  )
                  continue

              changes = {}
              conflict = False

              for name in TOURS:
                  column = columns[name]
                  discovered = events[name][week]
                  existing = row.get(column)

                  if existing not in (None, ""):
                      if str(existing) != str(discovered):
                          print(
                              f"Week {week}: "
                              f"conflicting {column}",
                              flush=True
                          )
                          conflict = True
                  else:
                      changes[column] = discovered

              if conflict:
                  print(
                      f"Week {week}: skipped",
                      flush=True
                  )
                  continue

              if not changes:
                  print(
                      f"Week {week}: already configured",
                      flush=True
                  )
                  continue

              filters = urllib.parse.urlencode({
                  "week_number": f"eq.{week}"
              })

              result = db(
                  "sgl_weeks?" + filters,
                  method="PATCH",
                  data=changes
              )

              if len(result) != 1:
                  raise RuntimeError(
                      f"Week {week}: expected one "
                      "updated database row"
                  )

              updated += 1

              print(
                  f"Week {week}: saved {changes}",
                  flush=True
              )

          print(
              "\nDISCOVERY COMPLETE",
              flush=True
          )
          print(
              f"Weeks updated: {updated}",
              flush=True
          )
          PY
